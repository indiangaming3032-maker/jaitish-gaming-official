<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JAITISH NEON RACING</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#02040a;
font-family:Arial,Helvetica,sans-serif;
touch-action:none;
user-select:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 35%,
#17294d 0%,
#080d1c 45%,
#010207 100%);
}

/* HUD */

.hud{
position:absolute;
top:10px;
left:10px;
right:10px;
z-index:100;
display:flex;
justify-content:space-between;
align-items:center;
gap:7px;
}

.box{
padding:7px 10px;
border:1px solid #00eaff;
border-radius:10px;
background:rgba(0,10,25,.9);
color:white;
font-size:13px;
font-weight:bold;
box-shadow:
0 0 8px #00eaff,
inset 0 0 8px rgba(0,234,255,.15);
}

/* SPEED */

.speed{
position:absolute;
top:58px;
left:50%;
transform:translateX(-50%);
z-index:100;
padding:7px 15px;
border:1px solid #00ff88;
border-radius:10px;
background:#00150c;
color:#00ff88;
font-weight:bold;
font-size:14px;
box-shadow:0 0 12px #00ff88;
}

/* ROAD */

.road{
position:absolute;
left:0;
top:0;
width:100vw;
height:100vh;

background:
linear-gradient(
90deg,
#101010 0%,
#222 17%,
#303030 50%,
#222 83%,
#101010 100%
);

border-left:6px solid #00eaff;
border-right:6px solid #00eaff;

box-shadow:
0 0 18px #00eaff,
inset 0 0 70px #000;
}

/* ROAD LINES */

.line{
position:absolute;
width:7px;
height:90px;
background:white;
border-radius:5px;

box-shadow:
0 0 10px white,
0 0 20px #00eaff;
}

.line1{
left:33.33%;
top:-100px;
}

.line2{
left:66.66%;
top:-300px;
}

/* PLAYER */

#player{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%);

width:75px;
height:110px;

display:flex;
align-items:center;
justify-content:center;

font-size:55px;
z-index:50;

filter:
drop-shadow(0 0 8px #00eaff)
drop-shadow(0 0 18px #00eaff);

transition:left .08s linear;
}

/* ENEMY */

.enemy{
position:absolute;
width:65px;
height:100px;

display:flex;
align-items:center;
justify-content:center;

font-size:48px;
z-index:40;

filter:
drop-shadow(0 0 8px red)
drop-shadow(0 0 18px red);
}

/* COIN */

.coin{
position:absolute;
width:40px;
height:40px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
z-index:35;

filter:
drop-shadow(0 0 8px gold)
drop-shadow(0 0 18px orange);
}

/* SCENERY */

.tree{
position:absolute;
font-size:42px;
z-index:20;

filter:
drop-shadow(0 0 7px #00ff88);
}

.house{
position:absolute;
font-size:42px;
z-index:20;

filter:
drop-shadow(0 0 7px #ffcc00);
}

/* MENU */

#menu{
position:absolute;
inset:0;
z-index:300;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
rgba(0,234,255,.15),
rgba(0,0,0,.94) 65%
);

color:white;
text-align:center;
}

#menu h1{
font-size:36px;
color:#00eaff;

text-shadow:
0 0 8px #00eaff,
0 0 20px #00eaff,
0 0 40px #0077ff;

margin-bottom:10px;
}

#menu p{
font-size:14px;
color:#aaa;
margin-bottom:25px;
}

.start{
border:none;
padding:14px 35px;

border-radius:30px;

background:#00eaff;
color:#001018;

font-size:17px;
font-weight:bold;

cursor:pointer;

box-shadow:
0 0 10px #00eaff,
0 0 30px #00eaff;

margin:7px;
}

.start:active{
transform:scale(.94);
}

#levelSelect{
padding:11px 20px;

border-radius:20px;

border:1px solid #00eaff;

background:#00111c;
color:#00eaff;

font-size:15px;
font-weight:bold;

outline:none;

margin-bottom:8px;
}

/* GAME OVER */

#gameOver{
position:absolute;
inset:0;

z-index:400;

display:none;

align-items:center;
justify-content:center;
flex-direction:column;

background:rgba(0,0,0,.88);

color:white;
text-align:center;
}

#gameOver h2{
font-size:38px;
color:#ff1744;

text-shadow:
0 0 10px red,
0 0 25px red;

margin-bottom:12px;
}

#finalScore{
font-size:20px;
margin-bottom:20px;
}

/* CONTROLS */

.controls{
position:absolute;

bottom:15px;
left:0;
right:0;

z-index:500;

display:flex;
justify-content:center;
gap:35px;
}

.control{
width:70px;
height:60px;

border-radius:18px;

border:2px solid #00eaff;

background:rgba(0,20,35,.9);

color:#00eaff;

font-size:30px;
font-weight:bold;

box-shadow:0 0 12px #00eaff;

cursor:pointer;

touch-action:none;
}

.control:active{
transform:scale(.9);
background:#00eaff;
color:#001018;
}

/* NITRO */

#nitroBtn{
position:absolute;

right:15px;
bottom:90px;

z-index:500;

width:70px;
height:70px;

border-radius:50%;

border:2px solid #ff9800;

background:#321800;

color:#ff9800;

font-size:12px;
font-weight:bold;

box-shadow:
0 0 12px #ff9800,
0 0 25px rgba(255,152,0,.5);

touch-action:none;
}

#nitroBtn:active{
transform:scale(.9);
background:#ff9800;
color:#160900;
}

/* FULLSCREEN */

#fullBtn{
position:absolute;

top:95px;
right:12px;

z-index:150;

padding:8px 11px;

border:1px solid #00eaff;

border-radius:10px;

background:rgba(0,10,25,.9);

color:#00eaff;

font-size:14px;
font-weight:bold;

cursor:pointer;

box-shadow:0 0 10px #00eaff;
}

#fullBtn:active{
transform:scale(.92);
}

</style>
</head>

<body>

<div id="game">

<div class="road">

<div class="line line1"></div>
<div class="line line2"></div>

<div id="player">🏎️</div>

</div>

<div class="hud">

<div class="box">
🏆 SCORE: <span id="score">0</span>
</div>

<div class="box">
🪙 COINS: <span id="coins">0</span>
</div>

<div class="box">
⚡ LEVEL: <span id="level">LOW</span>
</div>

</div>

<div class="speed">
SPEED: <span id="speed">0</span> KM/H
</div>

<button id="fullBtn">⛶</button>


<!-- MENU -->

<div id="menu">

<h1>JAITISH NEON RACING</h1>

<p>🏎️ Race • ⚡ Nitro • 🪙 Coins • 🏆 Score</p>

<select id="levelSelect">

<option value="LOW">🟢 LOW</option>

<option value="MEDIUM">🟡 MEDIUM</option>

<option value="HIGH">🔴 HIGH</option>

</select>

<button class="start" id="startBtn">
START RACE 🚀
</button>

</div>


<!-- GAME OVER -->

<div id="gameOver">

<h2>💥 CRASH!</h2>

<div id="finalScore">
SCORE: 0
</div>

<button class="start" id="restartBtn">
RESTART 🔄
</button>

</div>


<!-- MOBILE CONTROLS -->

<div class="controls">

<button class="control" id="leftBtn">
⬅️
</button>

<button class="control" id="rightBtn">
➡️
</button>

</div>


<!-- NITRO -->

<button id="nitroBtn">
⚡<br>NITRO
</button>


<!-- SOUND -->

<audio
id="carSound"
src="mizanstock-lamborghini-urus-racing-sound-effect-163336%20%281%29.mp3"
loop
preload="auto">
</audio>

</div>


<script>

let running=false;
let score=0;
let coins=0;
let speed=4;
let nitro=false;
let playerX=50;

let enemies=[];
let coinItems=[];
let scenery=[];

let animationId=null;

const game=document.getElementById("game");
const player=document.getElementById("player");

const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");
const levelText=document.getElementById("level");
const speedText=document.getElementById("speed");

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");

const levelSelect=document.getElementById("levelSelect");

const carSound=document.getElementById("carSound");

const lanes=[25,50,75];


function startGame(){

running=true;

score=0;
coins=0;
playerX=50;
nitro=false;

const selected=levelSelect.value;

if(selected==="LOW"){
speed=4;
}

if(selected==="MEDIUM"){
speed=6;
}

if(selected==="HIGH"){
speed=8;
}

scoreText.textContent="0";
coinsText.textContent="0";
levelText.textContent=selected;
speedText.textContent=speed*10;

player.style.left="50%";

menu.style.display="none";
gameOver.style.display="none";

enemies.forEach(function(e){
e.el.remove();
});

coinItems.forEach(function(c){
c.el.remove();
});

scenery.forEach(function(s){
s.el.remove();
});

enemies=[];
coinItems=[];
scenery=[];

try{

carSound.currentTime=0;

carSound.play().catch(function(){});

}catch(e){}

cancelAnimationFrame(animationId);

gameLoop();

}


function moveLeft(){

if(!running)return;

playerX-=8;

if(playerX<15){
playerX=15;
}

player.style.left=playerX+"%";

}


function moveRight(){

if(!running)return;

playerX+=8;

if(playerX>85){
playerX=85;
}

player.style.left=playerX+"%";

}


function createEnemy(){

if(!running)return;

const el=document.createElement("div");

el.className="enemy";

const cars=[
"🚗",
"🚙",
"🚕",
"🏎️"
];

el.textContent=
cars[Math.floor(Math.random()*cars.length)];

const lane=
lanes[Math.floor(Math.random()*lanes.length)];

el.style.left=lane+"%";
el.style.top="-120px";

game.appendChild(el);

enemies.push({

el:el,
x:lane,
y:-120

});

}


function createCoin(){

if(!running)return;

const el=document.createElement("div");

el.className="coin";

el.textContent="🪙";

const lane=
lanes[Math.floor(Math.random()*lanes.length)];

el.style.left=lane+"%";
el.style.top="-50px";

game.appendChild(el);

coinItems.push({

el:el,
x:lane,
y:-50

});

}


function createScenery(){

if(!running)return;

const el=document.createElement("div");

const isTree=Math.random()<0.7;

el.className=
isTree ? "tree" : "house";

el.textContent=
isTree
?
(Math.random()<0.5?"🌳":"🌲")
:
(Math.random()<0.5?"🏠":"🏡");

const side=Math.random()<0.5;

el.style.left=
side
?
(Math.random()*15)+"%"
:
(85+Math.random()*10)+"%";

el.style.top="-70px";

game.appendChild(el);

scenery.push({

el:el,
y:-70

});

}


function isCollision(a,b){

const r1=a.getBoundingClientRect();
const r2=b.getBoundingClientRect();

return !(
r1.right<r2.left ||
r1.left>r2.right ||
r1.bottom<r2.top ||
r1.top>r2.bottom
);

}


function gameLoop(){

if(!running)return;

let currentSpeed=speed;

if(nitro){
currentSpeed+=8;
}

score+=0.05;

scoreText.textContent=
Math.floor(score);

speedText.textContent=
Math.floor(currentSpeed*10);


/* ROAD */

document.querySelectorAll(".line")
.forEach(function(line){

let top=
parseFloat(line.style.top)||0;

top+=currentSpeed*1.8;

if(top>window.innerHeight){
top=-120;
}

line.style.top=
top+"px";

});


/* ENEMIES */

for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=enemies[i];

enemy.y+=currentSpeed*1.5;

enemy.el.style.top=
enemy.y+"px";

if(isCollision(player,enemy.el)){

endGame();

return;

}

if(
enemy.y>
window.innerHeight+150
){

enemy.el.remove();

enemies.splice(i,1);

}

}


/* COINS */

for(
let i=coinItems.length-1;
i>=0;
i--
){

const coin=coinItems[i];

coin.y+=currentSpeed*1.5;

coin.el.style.top=
coin.y+"px";

if(
isCollision(player,coin.el)
){

coins++;

score+=10;

coinsText.textContent=
coins;

coin.el.remove();

coinItems.splice(i,1);

}

else if(
coin.y>
window.innerHeight+100
){

coin.el.remove();

coinItems.splice(i,1);

}

}


/* SCENERY */

for(
let i=scenery.length-1;
i>=0;
i--
){

const item=scenery[i];

item.y+=currentSpeed;

item.el.style.top=
item.y+"px";

if(
item.y>
window.innerHeight+100
){

item.el.remove();

scenery.splice(i,1);

}

}


/* CREATE OBJECTS */

if(Math.random()<0.025){
createEnemy();
}

if(Math.random()<0.018){
createCoin();
}

if(Math.random()<0.012){
createScenery();
}


animationId=
requestAnimationFrame(gameLoop);

}


/* GAME OVER */

function endGame(){

running=false;

nitro=false;

cancelAnimationFrame(animationId);

try{
carSound.pause();
}catch(e){}

finalScore.textContent=
"SCORE: "+
Math.floor(score)+
" | COINS: "+
coins;

gameOver.style.display="flex";

}


/* START BUTTON */

document
.getElementById("startBtn")
.addEventListener(
"click",
startGame
);


/* RESTART BUTTON */

document
.getElementById("restartBtn")
.addEventListener(
"click",
startGame
);


/* LEFT BUTTON */

document
.getElementById("leftBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveLeft();

}
);


/* RIGHT BUTTON */

document
.getElementById("rightBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveRight();

}
);


/* NITRO */

document
.getElementById("nitroBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

if(running){
nitro=true;
}

}
);


document
.getElementById("nitroBtn")
.addEventListener(
"pointerup",
function(){

nitro=false;

}
);


document
.getElementById("nitroBtn")
.addEventListener(
"pointercancel",
function(){

nitro=false;

}
);


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

if(
e.key==="ArrowLeft" ||
e.key==="a" ||
e.key==="A"
){

moveLeft();

}


if(
e.key==="ArrowRight" ||
e.key==="d" ||
e.key==="D"
){

moveRight();

}


if(
e.key===" " ||
e.key==="Shift"
){

if(running){
nitro=true;
}

}

}
);


/* KEYBOARD NITRO RELEASE */

document.addEventListener(
"keyup",
function(e){

if(
e.key===" " ||
e.key==="Shift"
){

nitro=false;

}

}
);


/* FULLSCREEN */

document
.getElementById("fullBtn")
.addEventListener(
"click",
function(){

const el=
document.documentElement;

if(!document.fullscreenElement){

if(el.requestFullscreen){

el.requestFullscreen()
.catch(function(){});

}

}else{

if(document.exitFullscreen){

document.exitFullscreen()
.catch(function(){});

}

}

}
);

</script>

</body>
</html>
