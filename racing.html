<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JAITISH RACING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#02030a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    touch-action:none;
}

/* TOP BAR */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(2,3,10,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,234,255,.3);
}

.logo{
    color:#00eaff;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 15px #00eaff;
}

.scoreBox{
    display:flex;
    gap:10px;
    align-items:center;
}

.score{
    border:1px solid #00eaff;
    border-radius:15px;
    padding:7px 12px;
    color:#00eaff;
    font-weight:bold;
}

/* GAME */

.game{
    position:absolute;
    top:62px;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 20%,#101a42,transparent 45%),
        #02030a;
}

.road{
    position:relative;
    width:min(430px,100vw);
    height:100%;
    overflow:hidden;
    background:
        linear-gradient(
            90deg,
            #151515 0%,
            #242424 15%,
            #101010 15%,
            #101010 85%,
            #242424 85%,
            #151515 100%
        );
    border-left:4px solid #00eaff;
    border-right:4px solid #00eaff;
    box-shadow:
        0 0 25px rgba(0,234,255,.3),
        inset 0 0 40px rgba(0,0,0,.8);
}

/* ROAD LINES */

.lane{
    position:absolute;
    top:-150px;
    width:7px;
    height:110px;
    border-radius:5px;
    background:white;
    box-shadow:0 0 10px rgba(255,255,255,.7);
}

.lane.one{
    left:33.33%;
}

.lane.two{
    left:66.66%;
}

@keyframes roadMove{
    from{
        transform:translateY(-150px);
    }
    to{
        transform:translateY(100vh);
    }
}

/* SIDE LIGHTS */

.sideLight{
    position:absolute;
    width:5px;
    height:45px;
    background:#00eaff;
    box-shadow:0 0 15px #00eaff;
    animation:lights 1s linear infinite;
}

.sideLight.left{
    left:8px;
}

.sideLight.right{
    right:8px;
}

@keyframes lights{
    from{
        transform:translateY(-80px);
    }
    to{
        transform:translateY(110vh);
    }
}

/* CAR */

.car{
    position:absolute;
    width:58px;
    height:105px;
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    border-radius:17px 17px 12px 12px;

    background:
        linear-gradient(
            90deg,
            #006dff,
            #00eaff,
            #006dff
        );

    border:2px solid #7df8ff;

    box-shadow:
        0 0 12px #00eaff,
        0 0 30px #006dff;

    transition:left .10s linear;
}

/* CAR GLASS */

.car::before{
    content:"";
    position:absolute;
    left:9px;
    top:12px;
    width:36px;
    height:28px;
    border-radius:8px;
    background:
        linear-gradient(
            135deg,
            #d9ffff,
            #164b72
        );
    border:1px solid #bfffff;
}

.car::after{
    content:"";
    position:absolute;
    left:7px;
    right:7px;
    bottom:13px;
    height:8px;
    border-radius:8px;
    background:#06101b;
    box-shadow:
        0 0 10px #00eaff;
}

/* WHEELS */

.wheel{
    position:absolute;
    width:9px;
    height:25px;
    background:#050505;
    border-radius:5px;
    top:42px;
}

.w1{left:-7px;}
.w2{right:-7px;}

.w3{
    left:-7px;
    bottom:12px;
    top:auto;
}

.w4{
    right:-7px;
    bottom:12px;
    top:auto;
}

/* ENEMY */

.enemy{
    position:absolute;
    width:56px;
    height:100px;
    top:-120px;
    border-radius:16px 16px 11px 11px;
    background:
        linear-gradient(
            90deg,
            #ff003c,
            #ff4d6d,
            #ff003c
        );
    border:2px solid #ff8099;
    box-shadow:
        0 0 15px #ff003c,
        0 0 30px rgba(255,0,60,.5);
    z-index:10;
}

.enemy::before{
    content:"";
    position:absolute;
    left:9px;
    top:12px;
    width:35px;
    height:27px;
    border-radius:8px;
    background:
        linear-gradient(
            135deg,
            #eaffff,
            #3b1820
        );
}

.enemy::after{
    content:"";
    position:absolute;
    left:7px;
    right:7px;
    bottom:13px;
    height:8px;
    background:#160008;
    border-radius:8px;
}

.enemyWheel{
    position:absolute;
    width:8px;
    height:24px;
    background:#020202;
    border-radius:5px;
}

.ew1{
    left:-7px;
    top:39px;
}

.ew2{
    right:-7px;
    top:39px;
}

.ew3{
    left:-7px;
    bottom:10px;
}

.ew4{
    right:-7px;
    bottom:10px;
}

/* HUD */

.hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudItem{
    padding:8px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,234,255,.35);
    color:#fff;
    font-size:13px;
}

/* SWIPE AREA */

.swipeText{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    padding:8px 15px;
    border-radius:20px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,234,255,.35);
    color:#aeefff;
    font-size:12px;
    text-align:center;
    white-space:nowrap;
}

/* NITRO */

.nitro{
    position:fixed;
    right:20px;
    bottom:25px;
    z-index:150;
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid #00eaff;
    background:
        radial-gradient(circle,#00eaff,#005c78);
    color:white;
    font-weight:bold;
    box-shadow:0 0 20px #00eaff;
    cursor:pointer;
}

.nitro:active{
    transform:scale(.92);
}

/* GAME OVER */

.gameOver{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
}

.gameOverBox{
    width:min(340px,90%);
    padding:30px;
    text-align:center;
    border-radius:25px;
    background:#080b18;
    border:1px solid #00eaff;
    box-shadow:0 0 35px rgba(0,234,255,.3);
}

.gameOverBox h1{
    color:#ff3158;
    text-shadow:0 0 15px #ff3158;
    margin-bottom:12px;
}

.finalScore{
    margin:15px 0;
    font-size:22px;
    color:#00eaff;
}

.restart{
    border:0;
    padding:13px 25px;
    border-radius:25px;
    background:#00eaff;
    color:#001018;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* DESKTOP HELP */

.keyboard{
    position:fixed;
    left:18px;
    bottom:25px;
    z-index:100;
    padding:9px 13px;
    border-radius:15px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,234,255,.3);
    color:#b8c9d5;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .keyboard{
        display:none;
    }

    .road{
        width:100vw;
    }

    .car{
        width:55px;
        height:100px;
    }

    .enemy{
        width:53px;
        height:96px;
    }

    .swipeText{
        bottom:14px;
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="logo">🏎️ JAITISH RACING</div>

    <div class="scoreBox">
        <div class="score">
            SCORE: <span id="score">0</span>
        </div>
    </div>
</div>

<div class="game">

    <div class="road" id="road">

        <div class="hud">
            <div class="hudItem">
                SPEED: <span id="speed">1x</span>
            </div>

            <div class="hudItem">
                BEST: <span id="best">0</span>
            </div>
        </div>

        <div class="lane one"></div>
        <div class="lane two"></div>

        <div class="sideLight left"></div>
        <div class="sideLight right"></div>

        <div class="car" id="player">

            <div class="wheel w1"></div>
            <div class="wheel w2"></div>
            <div class="wheel w3"></div>
            <div class="wheel w4"></div>

        </div>

        <div class="swipeText">
            📱 Swipe ← → &nbsp; | &nbsp; 💻 Arrow Keys
        </div>

    </div>

</div>

<button class="nitro" id="nitro">
    ⚡<br>
    NITRO
</button>

<div class="keyboard">
    💻 ← Left &nbsp;&nbsp; → Right
</div>

<div class="gameOver" id="gameOver">

    <div class="gameOverBox">

        <h1>GAME OVER</h1>

        <div class="finalScore">
            Score: <span id="finalScore">0</span>
        </div>

        <button class="restart" id="restart">
            🔄 PLAY AGAIN
        </button>

    </div>

</div>

<script>

/* =========================
   JAITISH RACING
   SWIPE + KEYBOARD
========================= */

const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const finalScore = document.getElementById("finalScore");
const bestText = document.getElementById("best");
const speedText = document.getElementById("speed");

const gameOverScreen = document.getElementById("gameOver");
const restartButton = document.getElementById("restart");
const nitroButton = document.getElementById("nitro");

let playerX = 50;

let score = 0;

let speed = 5;

let running = true;

let nitro = false;

let enemies = [];

let lastTime = 0;

let spawnTimer = 0;

let touchStartX = 0;
let touchStartY = 0;

let touchActive = false;

/* BEST SCORE */

let bestScore = 0;

try{
    bestScore =
        Number(localStorage.getItem("jaitishBest")) || 0;
}catch(e){
    bestScore = 0;
}

bestText.textContent = bestScore;


/* =========================
   PLAYER POSITION
========================= */

function setPlayerX(value){

    playerX = Math.max(8,Math.min(92,value));

    player.style.left = playerX + "%";

}


/* =========================
   KEYBOARD CONTROL
========================= */

document.addEventListener("keydown",(event)=>{

    if(!running) return;

    if(event.key === "ArrowLeft"){

        event.preventDefault();

        setPlayerX(playerX - 5);

    }

    if(event.key === "ArrowRight"){

        event.preventDefault();

        setPlayerX(playerX + 5);

    }

});


/* =========================
   TOUCH / SWIPE CONTROL
========================= */

road.addEventListener("touchstart",(event)=>{

    if(!running) return;

    const touch = event.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    touchActive = true;

},{passive:true});


road.addEventListener("touchmove",(event)=>{

    if(!running || !touchActive) return;

    const touch = event.touches[0];

    const currentX = touch.clientX;

    const difference =
        currentX - touchStartX;

    /*
      Direct movement while finger moves.
    */

    if(Math.abs(difference) > 8){

        const roadWidth =
            road.getBoundingClientRect().width;

        const movePercent =
            (difference / roadWidth) * 100;

        setPlayerX(playerX + movePercent);

        touchStartX = currentX;

    }

    event.preventDefault();

},{passive:false});


road.addEventListener("touchend",()=>{

    touchActive = false;

});


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(){

    const enemy =
        document.createElement("div");

    enemy.className = "enemy";

    const lane =
        Math.floor(Math.random()*3);

    const positions = [
        20,
        50,
        80
    ];

    enemy.dataset.x =
        positions[lane];

    enemy.style.left =
        positions[lane] + "%";

    enemy.style.top =
        "-130px";

    enemy.innerHTML = `
        <div class="enemyWheel ew1"></div>
        <div class="enemyWheel ew2"></div>
        <div class="enemyWheel ew3"></div>
        <div class="enemyWheel ew4"></div>
    `;

    road.appendChild(enemy);

    enemies.push({
        element:enemy,
        y:-130,
        x:positions[lane]
    });

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    return !(
        r1.bottom < r2.top ||
        r1.top > r2.bottom ||
        r1.right < r2.left ||
        r1.left > r2.right
    );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running = false;

    finalScore.textContent =
        Math.floor(score);

    if(score > bestScore){

        bestScore =
            Math.floor(score);

        bestText.textContent =
            bestScore;

        try{
            localStorage.setItem(
                "jaitishBest",
                bestScore
            );
        }catch(e){}

    }

    gameOverScreen.style.display =
        "flex";

}


/* =========================
   RESTART
========================= */

restartButton.addEventListener("click",()=>{

    enemies.forEach(enemy=>{

        enemy.element.remove();

    });

    enemies = [];

    score = 0;

    speed = 5;

    nitro = false;

    running = true;

    setPlayerX(50);

    gameOverScreen.style.display =
        "none";

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

});


/* =========================
   NITRO
========================= */

function activateNitro(){

    if(!running) return;

    if(nitro) return;

    nitro = true;

    speed *= 2.2;

    speedText.textContent =
        "NITRO ⚡";

    nitroButton.textContent =
        "🔥";

    setTimeout(()=>{

        nitro = false;

        speed =
            Math.min(
                5 + score / 800,
                12
            );

        speedText.textContent =
            (speed/5).toFixed(1) + "x";

        nitroButton.innerHTML =
            "⚡<br>NITRO";

    },3000);

}

nitroButton.addEventListener(
    "click",
    activateNitro
);


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running) return;

    const delta =
        Math.min(
            (time-lastTime)/16.67,
            3
        );

    lastTime = time;

    /* SCORE */

    score += 0.15 * delta;

    scoreText.textContent =
        Math.floor(score);


    /* SPEED */

    if(!nitro){

        speed =
            Math.min(
                5 + score/800,
                12
            );

        speedText.textContent =
            (speed/5).toFixed(1) + "x";

    }


    /* ROAD ANIMATION */

    document
        .querySelectorAll(".lane")
        .forEach(lane=>{

            lane.style.animation =
                `roadMove ${Math.max(
                    .25,
                    1.2/speed*5
                )}s linear infinite`;

        });


    document
        .querySelectorAll(".sideLight")
        .forEach(light=>{

            light.style.animationDuration =
                Math.max(
                    .2,
                    1/speed*5
                ) + "s";

        });


    /* SPAWN */

    spawnTimer += delta;

    const spawnRate =
        Math.max(
            35,
            75 - score/20
        );

    if(spawnTimer > spawnRate){

        createEnemy();

        spawnTimer = 0;

    }


    /* ENEMIES */

    enemies.forEach((enemy,index)=>{

        enemy.y +=
            speed * delta;

        enemy.element.style.top =
            enemy.y + "px";


        /* COLLISION */

        if(
            enemy.y > 0 &&
            collision(
                player,
                enemy.element
            )
        ){

            endGame();

        }


        /* REMOVE */

        if(enemy.y > road.clientHeight + 150){

            enemy.element.remove();

            enemies.splice(index,1);

        }

    });


    requestAnimationFrame(gameLoop);

}


/* =========================
   START
========================= */

setPlayerX(50);

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
