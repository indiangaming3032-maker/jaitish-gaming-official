<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>JAITISH RACING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#03040b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

/* ================= TOP ================= */

.top{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,234,255,.3);
}

.logo{
    color:#00eaff;
    font-size:20px;
    font-weight:900;
    text-shadow:0 0 15px #00eaff;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    padding:7px 9px;
    border-radius:9px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,234,255,.4);
    font-size:12px;
}

#score{
    color:#00eaff;
}

#coinCount{
    color:#ffd700;
}

/* ================= GAME ================= */

.game{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:min(430px,100vw);
    height:calc(100vh - 70px);
    overflow:hidden;
    background:
    linear-gradient(
        90deg,
        #07131b 0%,
        #111 14%,
        #222 15%,
        #080808 20%,
        #181818 50%,
        #080808 80%,
        #222 85%,
        #111 86%,
        #07131b 100%
    );
}

/* ================= ROAD ================= */

.road{
    position:absolute;
    left:10%;
    top:0;
    width:80%;
    height:100%;
    overflow:hidden;

    background:
    linear-gradient(
        90deg,
        #202020,
        #080808 10%,
        #181818 50%,
        #080808 90%,
        #202020
    );

    border-left:4px solid #444;
    border-right:4px solid #444;
}

.road:before,
.road:after{
    content:"";
    position:absolute;
    top:0;
    width:4px;
    height:100%;
    background:#00eaff;
    box-shadow:0 0 12px #00eaff;
    z-index:2;
}

.road:before{
    left:0;
}

.road:after{
    right:0;
}

/* ================= ROAD LINES ================= */

.lane{
    position:absolute;
    top:-100px;
    left:33.33%;
    width:6px;
    height:80px;
    background:#fff;
    opacity:.85;
    box-shadow:0 0 8px rgba(255,255,255,.8);
}

.lane2{
    left:66.66%;
}

/* ================= CARS ================= */

.car{
    position:absolute;
    width:52px;
    height:92px;
    border-radius:13px 13px 8px 8px;
}

/* player */

.player{
    bottom:65px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    background:
    linear-gradient(
        90deg,
        #005eff,
        #00bfff,
        #005eff
    );

    border:2px solid #00eaff;

    box-shadow:
    0 0 10px #00eaff,
    0 0 25px rgba(0,234,255,.8);
}

/* windshield */

.player:before,
.enemy:before{
    content:"";
    position:absolute;
    left:8px;
    top:13px;
    width:32px;
    height:25px;
    border-radius:7px;

    background:
    linear-gradient(
        135deg,
        #aaf7ff,
        #123c55
    );

    border:1px solid rgba(255,255,255,.5);
}

/* wheels */

.player:after,
.enemy:after{
    content:"";
    position:absolute;
    left:-6px;
    top:18px;
    width:5px;
    height:25px;
    border-radius:4px;
    background:#050505;

    box-shadow:
    59px 0 #050505,
    0 40px #050505,
    59px 40px #050505;
}

/* enemy */

.enemy{
    z-index:20;

    background:
    linear-gradient(
        90deg,
        #8b0000,
        #ff2020,
        #8b0000
    );

    border:2px solid #ff3838;

    box-shadow:
    0 0 15px rgba(255,30,30,.7);
}

/* ================= UNLOCK CARS ================= */

.player.green{
    background:
    linear-gradient(
        90deg,
        #008f42,
        #00ff70,
        #008f42
    );

    border-color:#00ff70;

    box-shadow:
    0 0 12px #00ff70,
    0 0 25px rgba(0,255,112,.7);
}

.player.yellow{
    background:
    linear-gradient(
        90deg,
        #b48600,
        #ffe600,
        #b48600
    );

    border-color:#ffe600;

    box-shadow:
    0 0 12px #ffe600,
    0 0 25px rgba(255,230,0,.7);
}

.player.pink{
    background:
    linear-gradient(
        90deg,
        #a90062,
        #ff3da8,
        #a90062
    );

    border-color:#ff5db8;

    box-shadow:
    0 0 12px #ff3da8,
    0 0 25px rgba(255,61,168,.7);
}

.player.gold{
    background:
    linear-gradient(
        90deg,
        #795500,
        #ffd700,
        #fff0a0,
        #a87500
    );

    border-color:#ffd700;

    box-shadow:
    0 0 15px #ffd700,
    0 0 30px rgba(255,215,0,.8);
}

/* ================= COINS ================= */

.coin{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    z-index:25;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#704900;
    font-size:12px;
    font-weight:900;

    background:
    radial-gradient(
        circle at 35% 30%,
        #fff8a5,
        #ffd700 35%,
        #d69a00 70%,
        #805600
    );

    border:2px solid #fff0a0;

    box-shadow:
    0 0 8px #ffd700,
    0 0 20px rgba(255,215,0,.8);
}

.coin:after{
    content:"$";
}

/* ================= GARAGE ================= */

.garage{
    position:absolute;
    right:7px;
    bottom:25px;
    z-index:60;

    display:flex;
    flex-direction:column;
    gap:5px;
}

.garage button{
    width:48px;
    height:33px;

    border-radius:8px;
    border:1px solid #00eaff;

    background:rgba(0,0,0,.75);
    color:#fff;

    font-size:9px;
    font-weight:bold;
}

.garage button.active{
    background:#00eaff;
    color:#001014;
}

.garage button.locked{
    color:#777;
    border-color:#555;
}

/* ================= NITRO ================= */

.nitro{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);

    width:120px;
    height:9px;

    border:1px solid #00eaff;
    border-radius:20px;
    overflow:hidden;

    background:#001014;
    z-index:55;
}

.nitroFill{
    width:100%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #008cff,
        #00eaff
    );

    box-shadow:0 0 15px #00eaff;
}

/* ================= UNLOCK MESSAGE ================= */

.unlock{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);

    z-index:90;

    padding:11px 18px;

    border-radius:13px;

    background:rgba(0,0,0,.88);

    border:1px solid #ffd700;

    color:#ffd700;

    font-weight:bold;
    font-size:13px;

    box-shadow:
    0 0 20px rgba(255,215,0,.55);

    display:none;
    white-space:nowrap;
}

/* ================= HINT ================= */

.hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    z-index:40;

    color:#aaa;
    font-size:10px;

    pointer-events:none;
}

/* ================= OVERLAY ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.74);

    backdrop-filter:blur(8px);
}

.panel{
    width:min(350px,90%);

    padding:28px 20px;

    text-align:center;

    border-radius:20px;

    background:rgba(4,10,18,.96);

    border:1px solid #00eaff;

    box-shadow:
    0 0 30px rgba(0,234,255,.25);
}

.panel h1{
    color:#00eaff;

    text-shadow:
    0 0 15px #00eaff;

    margin-bottom:12px;
}

.panel p{
    color:#ccc;
    margin:8px 0;
}

.startBtn{
    margin-top:18px;

    padding:13px 27px;

    border:none;
    border-radius:12px;

    background:#00eaff;
    color:#001014;

    font-weight:900;
    font-size:15px;

    box-shadow:
    0 0 20px rgba(0,234,255,.7);
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<!-- ================= TOP ================= -->

<div class="top">

    <div class="logo">
        🏁 JAITISH RACING
    </div>

    <div class="stats">

        <div class="stat">
            SCORE:
            <span id="score">0</span>
        </div>

        <div class="stat" id="coinCount">
            🪙
            <span id="coins">0</span>

</div>

<!-- ================= GAME ================= -->

<div class="game" id="game">

    <div class="road" id="road">

        <div class="lane" id="lane1"></div>

        </button>

        </button>

        <button id="yellowBtn"
        class="locked">

        </button>

        class="locked">

        </button>

        </button>

        class="nitroFill"

    <div class="overlay"

            <h1>
                🏎️ JAITISH RACING
            </h1>

                🔥 Dodge Cars
            </p>

                🪙 Collect Coins
            </p>

            <p>
                🚗 Unlock New Cars
            </p>

            <p>
                🪙 Coins:
                <b id="startCoins">0</b>
            </p>

            class="startBtn"

    <!-- game over -->

        <div class="panel">

            <h1>

            <p>
                Score:
                <b id="finalScore">0</b>

            <p>
                🪙 Coins:
                <b id="finalCoins">0</b>

            <p>
                🏆 Best:
                <b id="bestScore">0</b>

            <button
            class="startBtn"
            id="restartBtn">
                PLAY AGAIN 🔥
            </button>

        </div>

    </div>

</div>

<!-- ================= ORIGINAL LAMBORGHINI SOUND ================= -->

<audio
id="lamborghiniSound"
src="mizanstock-lamborghini-urus-racing-sound-effect-163336%20(1).mp3"
loop
preload="auto">
</audio>

<script>

/* =====================================================
   JAITISH RACING
   ORIGINAL LAMBORGHINI URUS SOUND
   ===================================================== */

const game =
document.getElementById("game");

const road =
document.getElementById("road");

const player =
document.getElementById("player");

const scoreEl =
document.getElementById("score");

const coinsEl =
document.getElementById("coins");

const startCoinsEl =
document.getElementById("startCoins");

const finalScoreEl =
document.getElementById("finalScore");

const finalCoinsEl =
document.getElementById("finalCoins");

const bestScoreEl =
document.getElementById("bestScore");

const startScreen =
document.getElementById("startScreen");

const gameOver =
document.getElementById("gameOver");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");

const nitroFill =
document.getElementById("nitroFill");

const unlockBox =
document.getElementById("unlock");

const lamborghiniSound =
document.getElementById("lamborghiniSound");

/* ================= VARIABLES ================= */

let running = false;

let score = 0;

let coins = 0;

let bestScore = 0;

let speed = 5;

let playerX = 50;

let enemies = [];

let coinObjects = [];

let animationId = null;

let enemyTimer = 0;

let coinTimer = 0;

let nitro = 100;

let nitroActive = false;

let currentCar = "blue";

let lastUnlockScore = 0;

/* ================= AUDIO ================= */

let audioCtx = null;

function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(
        audioCtx.state ===
        "suspended"
    ){

        audioCtx.resume();
    }
}

/* simple effects */

function effectSound(
    frequency,
    duration,
    type="sine"
){

    if(!audioCtx) return;

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type = type;

    osc.frequency.value =
    frequency;

    gain.gain.setValueAtTime(
        .09,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime +
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime +
        duration
    );
}

/* coin */

function coinSound(){

    effectSound(
        750,
        .08,
        "square"
    );

    setTimeout(
        ()=>{
            effectSound(
                1100,
                .12,
                "square"
            );
        },
        70
    );
}

/* unlock */

function unlockSound(){

    effectSound(
        500,
        .1,
        "sine"
    );

    setTimeout(
        ()=>{
            effectSound(
                750,
                .1,
                "sine"
            );
        },
        100
    );

    setTimeout(
        ()=>{
            effectSound(
                1100,
                .2,
                "sine"
            );
        },
        200
    );
}

/* crash */

function crashSound(){

    effectSound(
        100,
        .3,
        "sawtooth"
    );

    setTimeout(
        ()=>{
            effectSound(
                55,
                .4,
                "sawtooth"
            );
        },
        100
    );
}

/* ================= SAVE ================= */

function loadSave(){

    try{

        bestScore =
        Number(
            localStorage.getItem(
                "jaitish_best"
            )
        ) || 0;

        coins =
        Number(
            localStorage.getItem(
                "jaitish_coins"
            )
        ) || 0;

    }catch(error){

        bestScore = 0;
        coins = 0;
    }

    updateUI();
}

function saveGame(){

    try{

        localStorage.setItem(
            "jaitish_best",
            bestScore
        );

        localStorage.setItem(
            "jaitish_coins",
            coins
        );

    }catch(error){}
}

/* ================= CARS ================= */

const carData = {

    blue:{
        score:0,
        className:""
    },

    green:{
        score:100,
        className:"green"
    },

    yellow:{
        score:250,
        className:"yellow"
    },

    pink:{
        score:350,
        className:"pink"
    },

    gold:{
        score:400,
        className:"gold"
    }

};

function isUnlocked(car){

    return (
        score >=
        carData[car].score
    );
}

function updateGarage(){

    const buttons = {

        blue:
        document.getElementById(
            "blueBtn"
        ),

        green:
        document.getElementById(
            "greenBtn"
        ),

        yellow:
        document.getElementById(
            "yellowBtn"
        ),

        pink:
        document.getElementById(
            "pinkBtn"
        ),

        gold:
        document.getElementById(
            "goldBtn"
        )
    };

    for(
        const name in buttons
    ){

        const button =
        buttons[name];

        const unlocked =
        isUnlocked(name);

        if(unlocked){

            button.classList.remove(
                "locked"
            );

            if(name !== "blue"){

                button.textContent =
                name.toUpperCase();
            }

        }else{

            button.classList.add(
                "locked"
            );

            if(name !== "blue"){

                button.textContent =
                "🔒" +
                carData[name].score;
            }
        }

        button.classList.toggle(
            "active",
            currentCar === name
        );
    }
}

function selectCar(name){

    if(!isUnlocked(name)){

        showUnlock(
            "🔒 Score " +
            carData[name].score +
            " required!"
        );

        effectSound(
            180,
            .15,
            "square"
        );

        return;
    }

    currentCar = name;

    player.className =
    "car player";

    if(
        carData[name].className
    ){

        player.classList.add(
            carData[name].className
        );
    }

    updateGarage();

    effectSound(
        550,
        .1,
        "sine"
    );
}

/* car buttons */

document
.getElementById("blueBtn")
.addEventListener(
    "click",
    ()=>{
        initAudio();
        selectCar("blue");
    }
);

document
.getElementById("greenBtn")
.addEventListener(
    "click",
    ()=>{
        initAudio();
        selectCar("green");
    }
);

document
.getElementById("yellowBtn")
.addEventListener(
    "click",
    ()=>{
        initAudio();
        selectCar("yellow");
    }
);

document
.getElementById("pinkBtn")
.addEventListener(
    "click",
    ()=>{
        initAudio();
        selectCar("pink");
    }
);

document
.getElementById("goldBtn")
.addEventListener(
    "click",
    ()=>{
        initAudio();
        selectCar("gold");
    }
);

/* ================= UI ================= */

function updateUI(){

    scoreEl.textContent =
    Math.floor(score);

    coinsEl.textContent =
    coins;

    startCoinsEl.textContent =
    coins;

    updateGarage();
}

function showUnlock(message){

    unlockBox.textContent =
    message;

    unlockBox.style.display =
    "block";

    setTimeout(
        ()=>{
            unlockBox.style.display =
            "none";
        },
        2200
    );
}

/* ================= ENEMY ================= */

function spawnEnemy(){

    const enemy =
    document.createElement(
        "div"
    );

    enemy.className =
    "car enemy";

    const lanes =
    [16.5,50,83.5];

    const lane =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ];

    enemy.style.left =
    lane + "%";

    enemy.style.top =
    "-110px";

    road.appendChild(enemy);

    enemies.push({

        el:enemy,

        y:-110,

        speed:
        speed +
        Math.random()*2
    });
}

/* ================= COIN ================= */

function spawnCoin(){

    const coin =
    document.createElement(
        "div"
    );

    coin.className =
    "coin";

    const lanes =
    [16.5,50,83.5];

    const lane =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ];

    coin.style.left =
    "calc(" +
    lane +
    "% - 13px)";

    coin.style.top =
    "-40px";

    road.appendChild(coin);

    coinObjects.push({

        el:coin,

        y:-40,

        speed:speed
    });
}

/* ================= COLLISION ================= */

function overlap(a,b){

    const r1 =
    a.getBoundingClientRect();

    const r2 =
    b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}

/* ================= UNLOCK ================= */

function checkUnlocks(){

    const levels = [

        {
            score:100,
            name:"TAXI GREEN 🟢"
        },

        {
            score:250,
            name:"TAXI YELLOW 🟡"
        },

        {
            score:350,
            name:"PINK CAR 💗"
        },

        {
            score:400,
            name:"GOLDEN CAR 🏆"
        }
    ];

    for(
        const item of levels
    ){

        if(
            score >= item.score &&
            lastUnlockScore <
            item.score
        ){

            showUnlock(
                "🎉 " +
                item.name +
                " UNLOCKED!"
            );

            unlockSound();

            lastUnlockScore =
            item.score;
        }
    }
}

/* ================= UPDATE ================= */

function update(){

    if(!running)
    return;

    /* score */

    score += .08;

    /* speed */

    speed =
    Math.min(
        11,
        5 + score / 180
    );

    /* road lines */

    const lanes =
    document.querySelectorAll(
        ".lane"
    );

    lanes.forEach(
        lane=>{

            let y =
            parseFloat(
                lane.dataset.y ||
                -100
            );

            y += speed;

            if(
                y >
                road.offsetHeight
            ){

                y = -100;
            }

            lane.dataset.y =
            y;

            lane.style.top =
            y + "px";
        }
    );

    /* enemies */

    enemyTimer++;

    if(
        enemyTimer >
        Math.max(
            35,
            75 - score/10
        )
    ){

        spawnEnemy();

        enemyTimer = 0;
    }

    /* coins */

    coinTimer++;

    if(
        coinTimer > 65
    ){

        spawnCoin();

        coinTimer = 0;
    }

    /* move enemies */

    for(
        let i =
        enemies.length-1;
        i >= 0;
        i--
    ){

        const enemy =
        enemies[i];

        enemy.y +=
        enemy.speed;

        enemy.el.style.top =
        enemy.y + "px";

        if(
            overlap(
                player,
                enemy.el
            )
        ){

            endGame();

            return;
        }

        if(
            enemy.y >
            road.offsetHeight + 120
        ){

            enemy.el.remove();

            enemies.splice(
                i,
                1
            );
        }
    }

    /* move coins */

    for(
        let i =
        coinObjects.length-1;
        i >= 0;
        i--
    ){

        const coin =
        coinObjects[i];

        coin.y +=
        coin.speed;

        coin.el.style.top =
        coin.y + "px";

        if(
            overlap(
                player,
                coin.el
            )
        ){

            coins++;

            coinSound();

            coin.el.remove();

            coinObjects.splice(
                i,
                1
            );

            saveGame();

        }else if(
            coin.y >
            road.offsetHeight + 50
        ){

            coin.el.remove();

            coinObjects.splice(
                i,
                1
            );
        }
    }

    /* nitro */

    if(nitroActive){

        nitro -= .8;

        if(nitro <= 0){

            nitro = 0;

            nitroActive = false;
        }

    }else{

        nitro += .08;

        if(nitro > 100)
        nitro = 100;
    }

    nitroFill.style.width =
    nitro + "%";

    /* unlock */

    checkUnlocks();

    updateUI();

    animationId =
    requestAnimationFrame(
        update
    );
}

/* ================= START ================= */

function startGame(){

    initAudio();

    running = true;

    score = 0;

    speed = 5;

    nitro = 100;

    playerX = 50;

    lastUnlockScore = 0;

    player.style.left =
    playerX + "%";

    /* remove old objects */

    enemies.forEach(
        enemy =>
        enemy.el.remove()
    );

    coinObjects.forEach(
        coin =>
        coin.el.remove()
    );

    enemies = [];

    coinObjects = [];

    enemyTimer = 0;

    coinTimer = 0;

    startScreen.classList.add(
        "hidden"
    );

    gameOver.classList.add(
        "hidden"
    );

    /*
      IMPORTANT:
      Original Lamborghini Urus sound
      starts only after user presses
      START RACE.
    */

    lamborghiniSound.currentTime = 0;

    lamborghiniSound.volume = .55;

    lamborghiniSound.play()
    .catch(
        error=>{
            console.log(
                "Lamborghini sound:",
                error
            );
        }
    );

    effectSound(
        600,
        .12,
        "square"
    );

    cancelAnimationFrame(
        animationId
    );

    update();
}

/* ================= GAME OVER ================= */

function endGame(){

    if(!running)
    return;

    running = false;

    cancelAnimationFrame(
        animationId
    );

    /* stop Lamborghini */

    lamborghiniSound.pause();

    lamborghiniSound.currentTime = 0;

    crashSound();

    if(
        score > bestScore
    ){

        bestScore =
        Math.floor(score);
    }

    saveGame();

    finalScoreEl.textContent =
    Math.floor(score);

    finalCoinsEl.textContent =
    coins;

    bestScoreEl.textContent =
    bestScore;

    gameOver.classList.remove(
        "hidden"
    );
}

/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ){

            e.preventDefault();
        }

        if(
            e.key === "ArrowLeft"
        ){

            movePlayer(-5);
        }

        if(
            e.key === "ArrowRight"
        ){

            movePlayer(5);
        }

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            nitroActive = true;
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{

        if(
            e.code === "Space"
        ){

            nitroActive = false;
        }
    }
);

/* ================= PLAYER ================= */

function movePlayer(amount){

    if(!running)
    return;

    playerX += amount;

    playerX =
    Math.max(
        16.5,
        Math.min(
            83.5,
            playerX
        )
    );

    player.style.left =
    playerX + "%";
}

/* ================= SWIPE ================= */

let lastTouchX = 0;

game.addEventListener(
    "touchstart",
    e=>{

        if(!running)
        return;

        lastTouchX =
        e.touches[0].clientX;

    },
    {
        passive:false
    }
);

game.addEventListener(
    "touchmove",
    e=>{

        if(!running)
        return;

        e.preventDefault();

        const currentX =
        e.touches[0].clientX;

        const difference =
        currentX -
        lastTouchX;

        if(
            Math.abs(
                difference
            ) > 1
        ){

            movePlayer(
                difference * .12
            );
        }

        lastTouchX =
        currentX;

    },
    {
        passive:false
    }
);

game.addEventListener(
    "touchend",
    ()=>{
        lastTouchX = 0;
    },
    {
        passive:false
    }
);

/* ================= BUTTONS ================= */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

/* ================= LOAD ================= */

loadSave();

updateGarage();

</script>
