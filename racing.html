<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JAITISH NEON RACING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

#game{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:#02040a;
}

/* ROAD */

.road{
position:absolute;
left:50%;
transform:translateX(-50%);
width:min(92vw,500px);
height:100%;
background:
linear-gradient(
90deg,
#02050a 0%,
#10141d 15%,
#151922 50%,
#10141d 85%,
#02050a 100%
);

border-left:4px solid #00eaff;
border-right:4px solid #00eaff;

box-shadow:
0 0 15px #00eaff,
inset 0 0 35px rgba(0,234,255,.15);

overflow:hidden;
}

/* MOVING ROAD LINES */

.road::before{
content:"";
position:absolute;
top:-200%;
left:50%;
transform:translateX(-50%);

width:8px;
height:300%;

background:repeating-linear-gradient(
to bottom,
transparent 0px,
transparent 65px,
rgba(255,255,255,.9) 65px,
rgba(255,255,255,.9) 125px,
transparent 125px,
transparent 190px
);

animation:roadMove .55s linear infinite;
}

@keyframes roadMove{

from{
transform:translate(-50%,0);
}

to{
transform:translate(-50%,190px);
}

}

/* HUD */

.hud{
position:absolute;
top:15px;
left:15px;
right:15px;
z-index:300;

display:flex;
justify-content:space-between;
align-items:center;

color:white;
font-weight:bold;
font-size:15px;

text-shadow:
0 0 8px #00eaff;
}

.hudBox{
background:rgba(0,10,20,.75);
border:1px solid #00eaff;
border-radius:10px;
padding:8px 12px;

box-shadow:
0 0 10px rgba(0,234,255,.5);
}

/* SPEED */

#speedDisplay{
position:absolute;
top:65px;
left:50%;
transform:translateX(-50%);

z-index:300;

color:#00eaff;
font-size:18px;
font-weight:bold;

text-shadow:
0 0 8px #00eaff;
}

/* BLUE PLAYER CAR */

#player{
position:absolute;

bottom:80px;
left:50%;

transform:translateX(-50%);

width:75px;
height:115px;

z-index:100;

transition:left .08s linear;
}

/* CAR BODY */

.car-body{
position:absolute;

left:50%;
top:5px;

transform:translateX(-50%);

width:52px;
height:105px;

background:
linear-gradient(
90deg,
#061b3a 0%,
#006eff 25%,
#00bfff 50%,
#006eff 75%,
#061b3a 100%
);

border-radius:18px 18px 13px 13px;

border:2px solid #00eaff;

box-shadow:
0 0 8px #00eaff,
0 0 18px #008cff,
0 0 30px rgba(0,234,255,.7);
}

/* ROOF */

.car-body::before{
content:"";

position:absolute;

top:18px;
left:7px;

width:34px;
height:38px;

background:
linear-gradient(
135deg,
#06111f,
#123b62
);

border:2px solid #00eaff;

border-radius:12px 12px 8px 8px;

box-shadow:
inset 0 0 10px #001a33;
}

/* WINDOW */

.car-window{
position:absolute;

top:22px;
left:10px;

width:30px;
height:18px;

background:#06101c;

border:1px solid #66eaff;

border-radius:7px;

z-index:2;

box-shadow:
0 0 6px #00eaff;
}

/* HEADLIGHTS */

.car-light{
position:absolute;

bottom:10px;

width:10px;
height:7px;

background:#fff;

border-radius:4px;

box-shadow:
0 0 8px white,
0 0 15px #00eaff;

z-index:3;
}

.left-light{
left:7px;
}

.right-light{
right:7px;
}

/* CENTER LINE */

.car-body::after{
content:"";

position:absolute;

left:50%;
bottom:8px;

transform:translateX(-50%);

width:3px;
height:35px;

background:#b9f7ff;

box-shadow:
0 0 8px #00eaff;

border-radius:5px;
}

/* ENEMY CARS */

.enemy{
position:absolute;

font-size:42px;

z-index:60;

filter:
drop-shadow(0 0 8px #ff004c);
}

/* COINS */

.coin{
position:absolute;

font-size:30px;

z-index:55;

filter:
drop-shadow(0 0 8px gold);
}

/* MOBILE BUTTONS */

.controls{
position:absolute;

bottom:210px;

left:0;
right:0;

z-index:500;

display:flex;

justify-content:center;

align-items:center;

gap:35px;

pointer-events:none;
}

.control{
width:72px;
height:62px;

border-radius:18px;

border:2px solid #00eaff;

background:rgba(0,15,30,.95);

color:#00eaff;

font-size:30px;
font-weight:bold;

box-shadow:
0 0 12px #00eaff,
inset 0 0 12px rgba(0,234,255,.2);

cursor:pointer;

touch-action:none;

pointer-events:auto;
}

.control:active{
transform:scale(.9);

background:#00eaff;

color:#001018;
}

/* NITRO */

#nitroBtn{
position:absolute;

right:18px;

bottom:205px;

z-index:500;

width:72px;
height:58px;

border-radius:16px;

border:2px solid #ff3b00;

background:rgba(35,8,0,.95);

color:#ff6a00;

font-size:17px;
font-weight:bold;

box-shadow:
0 0 14px #ff3b00;

touch-action:none;
}

#nitroBtn.active{
background:#ff3b00;
color:white;

box-shadow:
0 0 25px #ff3b00;
}

/* FULLSCREEN */

#fullscreenBtn{
position:absolute;

top:105px;
right:15px;

z-index:500;

width:45px;
height:42px;

border:1px solid #00eaff;

border-radius:10px;

background:rgba(0,10,20,.8);

color:#00eaff;

font-size:20px;
}

/* START MENU */

#menu{
position:absolute;

inset:0;

z-index:1000;

display:flex;

align-items:center;

justify-content:center;

background:
radial-gradient(
circle,
rgba(0,234,255,.12),
rgba(0,0,0,.96) 65%
);
}

.menuBox{
width:min(88%,380px);

padding:30px 20px;

text-align:center;

border:2px solid #00eaff;

border-radius:22px;

background:rgba(0,8,18,.92);

box-shadow:
0 0 20px #00eaff,
inset 0 0 30px rgba(0,234,255,.08);
}

.menuTitle{
color:#00eaff;

font-size:32px;
font-weight:bold;

margin-bottom:8px;

text-shadow:
0 0 10px #00eaff,
0 0 25px #00eaff;
}

.menuSub{
color:#aaa;

font-size:14px;

margin-bottom:25px;
}

.difficulty{
display:flex;

justify-content:center;

gap:10px;

margin-bottom:20px;
}

.diffBtn{
padding:10px 15px;

border:1px solid #00eaff;

border-radius:10px;

background:#06121d;

color:#00eaff;

font-weight:bold;
}

.diffBtn.active{
background:#00eaff;
color:#001018;

box-shadow:
0 0 12px #00eaff;
}

#startBtn{
width:100%;

padding:15px;

border:0;

border-radius:14px;

background:#00eaff;

color:#001018;

font-size:18px;
font-weight:bold;

box-shadow:
0 0 20px #00eaff;

cursor:pointer;
}

/* GAME OVER */

#gameOver{
position:absolute;

inset:0;

z-index:900;

display:none;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.82);
}

.gameOverBox{
text-align:center;

background:#050b12;

border:2px solid #ff1744;

border-radius:20px;

padding:30px;

box-shadow:
0 0 25px #ff1744;
}

.gameOverTitle{
color:#ff1744;

font-size:32px;
font-weight:bold;

margin-bottom:15px;
}

#finalScore{
color:white;

font-size:20px;

margin-bottom:20px;
}

#restartBtn{
padding:13px 30px;

border:0;

border-radius:12px;

background:#00eaff;

color:#001018;

font-size:17px;
font-weight:bold;
}

/* SMALL PHONES */

@media(max-height:700px){

.controls{
bottom:165px;
}

#nitroBtn{
bottom:160px;
}

#player{
bottom:65px;
}

}

/* VERY SMALL PHONES */

@media(max-height:600px){

.controls{
bottom:135px;
}

#nitroBtn{
bottom:130px;
}

#player{
bottom:50px;
}

}

</style>

</head>

<body>

<div id="game">

<!-- ONLY STREET / ROAD -->

<div class="road"></div>

<!-- HUD -->

<div class="hud">

<div class="hudBox">
🏆 Score: <span id="score">0</span>
</div>

<div class="hudBox">
🪙 <span id="coins">0</span>
</div>

<div class="hudBox">
🔥 Level: <span id="level">1</span>
</div>

</div>

<div id="speedDisplay">
SPEED: <span id="speedValue">0</span>
</div>

<button id="fullscreenBtn">
⛶
</button>

<!-- BLUE CAR -->

<div id="player">

<div class="car-body">

<div class="car-window"></div>

<div class="car-light left-light"></div>

<div class="car-light right-light"></div>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<button
class="control"
id="leftBtn">
⬅
</button>

<button
class="control"
id="rightBtn">
➡
</button>

</div>

<!-- NITRO -->

<button id="nitroBtn">
⚡ NITRO
</button>

<!-- START MENU -->

<div id="menu">

<div class="menuBox">

<div class="menuTitle">
JAITISH NEON RACING
</div>

<div class="menuSub">
NEON STREET • RACING • SPEED
</div>

<div class="difficulty">

<button
class="diffBtn"
data-speed="4">
LOW
</button>

<button
class="diffBtn active"
data-speed="6">
MEDIUM
</button>

<button
class="diffBtn"
data-speed="8">
HIGH
</button>

</div>

<button id="startBtn">
START RACE 🚀
</button>

</div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

<div class="gameOverBox">

<div class="gameOverTitle">
GAME OVER
</div>

<div id="finalScore">
Score: 0
</div>

<button id="restartBtn">
RESTART 🔄
</button>

</div>

</div>

</div>

<!-- SOUND -->

<audio
id="carSound"
loop
preload="auto">

<source
src="mizanstock-lamborghini-urus-racing-sound-effect-163336%20%281%29.mp3"
type="audio/mpeg">

</audio>

<script>

/* GAME VARIABLES */

let running=false;

let score=0;

let coinCount=0;

let level=1;

let playerX=50;

let speed=6;

let nitro=false;

let animationFrame;

let enemyTimer;

let coinTimer;


/* ELEMENTS */

const player=
document.getElementById("player");

const scoreEl=
document.getElementById("score");

const coinsEl=
document.getElementById("coins");

const levelEl=
document.getElementById("level");

const speedValue=
document.getElementById("speedValue");

const menu=
document.getElementById("menu");

const gameOver=
document.getElementById("gameOver");

const finalScore=
document.getElementById("finalScore");

const startBtn=
document.getElementById("startBtn");

const restartBtn=
document.getElementById("restartBtn");

const leftBtn=
document.getElementById("leftBtn");

const rightBtn=
document.getElementById("rightBtn");

const nitroBtn=
document.getElementById("nitroBtn");

const carSound=
document.getElementById("carSound");

const fullscreenBtn=
document.getElementById("fullscreenBtn");


/* DIFFICULTY */

document
.querySelectorAll(".diffBtn")
.forEach(function(btn){

btn.addEventListener(
"click",
function(){

document
.querySelectorAll(".diffBtn")
.forEach(function(b){

b.classList.remove("active");

});

btn.classList.add("active");

speed=
Number(btn.dataset.speed);

});

});


/* MOVE LEFT */

function moveLeft(){

if(!running)return;

playerX-=8;

if(playerX<15){

playerX=15;

}

player.style.left=
playerX+"%";

}


/* MOVE RIGHT */

function moveRight(){

if(!running)return;

playerX+=8;

if(playerX>85){

playerX=85;

}

player.style.left=
playerX+"%";

}


/* BUTTON CONTROLS */

leftBtn.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveLeft();

});

rightBtn.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveRight();

});


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

moveLeft();

}

if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

moveRight();

}

if(
e.key===" " ||
e.key==="Shift"
){

nitro=true;

nitroBtn.classList.add("active");

}

});


document.addEventListener(
"keyup",
function(e){

if(
e.key===" " ||
e.key==="Shift"
){

nitro=false;

nitroBtn.classList.remove("active");

}

});


/* NITRO */

nitroBtn.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

nitro=true;

nitroBtn.classList.add("active");

});


nitroBtn.addEventListener(
"pointerup",
function(){

nitro=false;

nitroBtn.classList.remove("active");

});


nitroBtn.addEventListener(
"pointercancel",
function(){

nitro=false;

nitroBtn.classList.remove("active");

});


/* CREATE ENEMY */

function createEnemy(){

if(!running)return;

const enemy=
document.createElement("div");

enemy.className="enemy";

const cars=[
"🚗",
"🚙",
"🚕",
"🏎️"
];

enemy.textContent=
cars[
Math.floor(
Math.random()*cars.length
)
];

enemy.style.left=
(18+Math.random()*64)+"%";

enemy.style.top="-80px";

document
.getElementById("game")
.appendChild(enemy);

let y=-80;

function moveEnemy(){

if(!running){

enemy.remove();

return;

}

let enemySpeed=
speed+2;

if(nitro){

enemySpeed+=3;

}

y+=enemySpeed;

enemy.style.top=
y+"px";

if(checkCollision(
player,
enemy
)){

endGame();

return;

}

if(y>window.innerHeight+100){

enemy.remove();

return;

}

requestAnimationFrame(moveEnemy);

}

moveEnemy();

}


/* CREATE COIN */

function createCoin(){

if(!running)return;

const coin=
document.createElement("div");

coin.className="coin";

coin.textContent="🪙";

coin.style.left=
(20+Math.random()*60)+"%";

coin.style.top="-60px";

document
.getElementById("game")
.appendChild(coin);

let y=-60;

function moveCoin(){

if(!running){

coin.remove();

return;

}

y+=speed;

coin.style.top=
y+"px";

if(checkCollision(
player,
coin
)){

coinCount++;

coinsEl.textContent=
coinCount;

coin.remove();

return;

}

if(y>window.innerHeight+80){

coin.remove();

return;

}

requestAnimationFrame(moveCoin);

}

moveCoin();

}


/* COLLISION */

function checkCollision(a,b){

const r1=
a.getBoundingClientRect();

const r2=
b.getBoundingClientRect();

return !(
r1.right<r2.left ||
r1.left>r2.right ||
r1.bottom<r2.top ||
r1.top>r2.bottom
);

}


/* GAME LOOP */

function gameLoop(){

if(!running)return;

let currentSpeed=
speed;

if(nitro){

currentSpeed+=8;

}

score+=0.05;

scoreEl.textContent=
Math.floor(score);

level=
Math.floor(score/500)+1;

levelEl.textContent=
level;

speedValue.textContent=
Math.floor(
currentSpeed*20
);

animationFrame=
requestAnimationFrame(gameLoop);

}


/* START GAME */

function startGame(){

running=true;

score=0;

coinCount=0;

level=1;

playerX=50;

player.style.left="50%";

scoreEl.textContent="0";

coinsEl.textContent="0";

levelEl.textContent="1";

speedValue.textContent=
speed*20;

menu.style.display="none";

gameOver.style.display="none";

try{

carSound.currentTime=0;

carSound.play().catch(
function(){}
);

}catch(e){}

clearInterval(enemyTimer);

clearInterval(coinTimer);

enemyTimer=
setInterval(
createEnemy,
Math.max(500,1000-speed*60)
);

coinTimer=
setInterval(
createCoin,
1500
);

cancelAnimationFrame(
animationFrame
);

gameLoop();

}


/* END GAME */

function endGame(){

if(!running)return;

running=false;

cancelAnimationFrame(
animationFrame
);

clearInterval(enemyTimer);

clearInterval(coinTimer);

try{

carSound.pause();

}catch(e){}

finalScore.textContent=
"Score: "+
Math.floor(score)+
"   🪙 Coins: "+
coinCount;

gameOver.style.display=
"flex";

}


/* START */

startBtn.addEventListener(
"click",
function(){

startGame();

});


/* RESTART */

restartBtn.addEventListener(
"click",
function(){

document
.querySelectorAll(".enemy,.coin")
.forEach(function(el){

el.remove();

});

startGame();

});


/* FULLSCREEN */

fullscreenBtn.addEventListener(
"click",
function(){

if(!document.fullscreenElement){

if(document.documentElement.requestFullscreen){

document
.documentElement
.requestFullscreen()
.catch(function(){});

}

}else{

if(document.exitFullscreen){

document
.exitFullscreen()
.catch(function(){});

}

}

});


/* KEEP PLAYER INSIDE SCREEN */

window.addEventListener(
"resize",
function(){

if(playerX<15){

playerX=15;

}

if(playerX>85){

playerX=85;

}

player.style.left=
playerX+"%";

});


</script>

</body>
</html>
