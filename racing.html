<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAITISH NEON RACING 2.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#02030a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    user-select:none;
}

/* ================= GAME ================= */

.game{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(circle at 50% 20%,rgba(0,234,255,.20),transparent 30%),
    linear-gradient(#02030a,#05000c);
}

/* ================= TOP ================= */

.top{
    position:absolute;
    top:12px;
    left:0;
    width:100%;
    z-index:30;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 18px;
}

.panel{
    background:rgba(3,10,20,.88);
    border:1px solid #00eaff;
    border-radius:14px;

    padding:9px 13px;

    box-shadow:
    0 0 12px rgba(0,234,255,.5);

    font-weight:bold;
    font-size:14px;
}

#score{
    color:#00eaff;
}

#coins{
    color:#ffd000;
}

/* ================= SPEED METER ================= */

.speed-box{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);

    z-index:25;

    width:150px;
    text-align:center;

    padding:8px 12px;

    border:2px solid #00eaff;
    border-radius:15px;

    background:rgba(2,8,18,.88);

    box-shadow:
    0 0 15px #00eaff,
    inset 0 0 15px rgba(0,234,255,.15);
}

.speed-label{
    color:#aaa;
    font-size:11px;
    letter-spacing:2px;
}

.speed-number{
    color:#00eaff;
    font-size:30px;
    font-weight:bold;

    text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.speed-unit{
    color:#fff;
    font-size:11px;
}

/* ================= LEVEL ================= */

.level-box{
    position:absolute;
    top:65px;
    left:18px;
    z-index:25;

    padding:8px 13px;

    border:1px solid #ffd000;
    border-radius:12px;

    background:rgba(20,12,2,.88);

    box-shadow:0 0 15px rgba(255,208,0,.35);
}

.level-box span{
    color:#ffd000;
    font-weight:bold;
}

/* ================= ROAD ================= */

.road{
    position:absolute;

    width:min(520px,82vw);
    height:100%;

    left:50%;
    transform:translateX(-50%);

    background:
    linear-gradient(
        90deg,
        #07090e 0%,
        #151821 8%,
        #10131a 92%,
        #07090e 100%
    );

    border-left:5px solid #00eaff;
    border-right:5px solid #ff00e6;

    box-shadow:
    0 0 25px rgba(0,234,255,.25),
    0 0 25px rgba(255,0,230,.20);
}

/* road center */

.line{
    position:absolute;

    width:8px;
    height:80px;

    background:white;

    left:50%;
    transform:translateX(-50%);

    box-shadow:
    0 0 15px white,
    0 0 30px rgba(255,255,255,.5);
}

/* ================= ROADSIDE ================= */

.side{
    position:absolute;
    top:0;
    width:calc((100% - min(520px,82vw))/2);
    height:100%;

    overflow:hidden;

    background:
    radial-gradient(circle at 50% 20%,rgba(0,255,100,.10),transparent 30%),
    linear-gradient(#031006,#06150a);
}

.side-left{
    left:0;
    border-right:1px solid rgba(0,234,255,.15);
}

.side-right{
    right:0;
    border-left:1px solid rgba(255,0,230,.15);
}

/* roadside objects */

.scenery{
    position:absolute;
    font-size:38px;
    filter:
    drop-shadow(0 0 7px rgba(0,255,120,.6));
}

.house{
    font-size:45px;
    filter:
    drop-shadow(0 0 8px rgba(255,200,0,.5));
}

.tree{
    font-size:42px;
}

.lamp{
    font-size:38px;
}

/* ================= PLAYER CAR ================= */

.car{
    position:absolute;

    width:75px;
    height:125px;

    bottom:82px;
    left:50%;

    transform:translateX(-50%);

    z-index:15;
}

.car-body{
    position:absolute;

    width:60px;
    height:110px;

    left:7px;
    top:8px;

    border-radius:18px 18px 12px 12px;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #00aaff,
        #00eaff
    );

    border:2px solid white;

    box-shadow:
    0 0 12px #00eaff,
    0 0 35px #00eaff,
    0 0 60px rgba(0,234,255,.4);

    transition:.3s;
}

.window{
    position:absolute;

    width:40px;
    height:35px;

    top:15px;
    left:10px;

    border-radius:10px;

    background:#07111d;

    border:2px solid #9fffff;

    box-shadow:
    inset 0 0 10px #00eaff;
}

.light{
    position:absolute;

    width:12px;
    height:8px;

    background:white;

    border-radius:50%;

    bottom:10px;

    box-shadow:
    0 0 12px white,
    0 0 20px #00eaff;
}

.light.left{
    left:10px;
}

.light.right{
    right:10px;
}

/* ================= NITRO GLOW ================= */

.nitro-flame{
    position:absolute;

    width:18px;
    height:35px;

    bottom:-25px;

    background:
    linear-gradient(#fff,#00eaff,transparent);

    border-radius:50%;

    filter:blur(2px);

    opacity:0;

    animation:flame .12s infinite alternate;
}

.nitro-flame.left{
    left:18px;
}

.nitro-flame.right{
    right:18px;
}

@keyframes flame{
    from{
        height:25px;
        opacity:.5;
    }
    to{
        height:42px;
        opacity:1;
    }
}

/* ================= ENEMY ================= */

.enemy{
    position:absolute;

    width:65px;
    height:110px;

    z-index:12;
}

.enemy-body{
    width:52px;
    height:95px;

    margin:auto;
    margin-top:7px;

    border-radius:17px;

    background:
    linear-gradient(
        90deg,
        #ff3030,
        #8b0000,
        #ff3030
    );

    border:2px solid #ffaaaa;

    box-shadow:
    0 0 20px #ff3030,
    0 0 35px rgba(255,48,48,.4);
}

.enemy-window{
    position:absolute;

    width:35px;
    height:28px;

    left:15px;
    top:17px;

    background:#130707;

    border:2px solid #ff7777;

    border-radius:8px;
}

/* ================= COIN ================= */

.coin{
    position:absolute;

    width:28px;
    height:28px;

    border-radius:50%;

    background:#ffd000;

    border:3px solid #fff2a0;

    box-shadow:
    0 0 18px #ffd000,
    0 0 35px rgba(255,208,0,.5);

    z-index:11;

    animation:spin .7s linear infinite;
}

@keyframes spin{
    from{
        transform:rotateY(0deg);
    }
    to{
        transform:rotateY(360deg);
    }
}

/* ================= CONTROLS ================= */

.controls{
    position:absolute;

    bottom:18px;
    left:0;

    width:100%;

    z-index:35;

    display:flex;
    justify-content:center;

    gap:15px;
}

.control{
    width:75px;
    height:55px;

    border:none;
    border-radius:15px;

    background:rgba(0,234,255,.15);

    color:#00eaff;

    border:2px solid #00eaff;

    font-size:25px;
    font-weight:bold;

    box-shadow:
    0 0 15px rgba(0,234,255,.5);

    cursor:pointer;
}

.control:active{
    transform:scale(.9);

    background:#00eaff;
    color:#000;
}

.nitro{
    color:#ff00e6;
    border-color:#ff00e6;

    box-shadow:
    0 0 15px rgba(255,0,230,.5);
}

/* ================= MENU ================= */

.menu{
    position:absolute;

    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle,rgba(0,234,255,.08),transparent 35%),
    rgba(1,3,10,.96);

    overflow:auto;
}

.menu-box{
    width:min(650px,94%);

    text-align:center;

    padding:28px 20px;

    border:2px solid #00eaff;
    border-radius:25px;

    background:rgba(4,10,20,.97);

    box-shadow:
    0 0 25px #00eaff,
    0 0 70px rgba(0,234,255,.25);
}

.menu-box h1{
    font-size:clamp(35px,8vw,65px);

    color:#00eaff;

    text-shadow:
    0 0 15px #00eaff,
    0 0 35px #00eaff;
}

.menu-box p{
    color:#aaa;
    margin-bottom:12px;
}

/* ================= LEVEL SELECT ================= */

.level-title{
    color:#ff00e6;

    font-size:20px;
    font-weight:bold;

    margin:14px 0;

    text-shadow:
    0 0 10px #ff00e6;
}

.level-selection{
    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:15px;
}

.level-option{
    width:115px;

    padding:11px 8px;

    border:2px solid #555;

    border-radius:15px;

    background:#07101c;

    cursor:pointer;

    transition:.3s;
}

.level-option:hover{
    transform:translateY(-4px);
}

.level-option.selected{
    border-color:#00eaff;

    box-shadow:
    0 0 15px #00eaff,
    0 0 30px rgba(0,234,255,.3);
}

.level-option h3{
    font-size:15px;
    margin-bottom:5px;
}

.level-option span{
    font-size:11px;
    color:#aaa;
}

.low h3{
    color:#00ff66;
}

.medium h3{
    color:#ffd000;
}

.high h3{
    color:#ff3030;
}

/* ================= CAR SELECT ================= */

.select-title{
    color:#ffd000;

    font-size:20px;
    font-weight:bold;

    margin:14px 0;

    text-shadow:
    0 0 10px #ffd000;
}

.car-selection{
    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.car-option{
    position:relative;

    width:120px;

    padding:12px 8px;

    border:2px solid #555;

    border-radius:15px;

    background:#07101c;

    cursor:pointer;

    transition:.3s;
}

.car-option:hover{
    transform:translateY(-5px);
}

.car-option.selected{
    border-color:#00eaff;

    box-shadow:
    0 0 15px #00eaff,
    0 0 30px rgba(0,234,255,.4);
}

.car-option.locked{
    opacity:.5;
    cursor:not-allowed;
}

.mini-car{
    width:42px;
    height:70px;

    margin:0 auto 8px;

    border-radius:12px;

    border:2px solid white;
}

.sky-car{
    background:
    linear-gradient(
        90deg,
        #00eaff,
        #00aaff,
        #00eaff
    );

    box-shadow:0 0 15px #00eaff;
}

.red-car{
    background:
    linear-gradient(
        90deg,
        #ff3030,
        #990000,
        #ff3030
    );

    box-shadow:0 0 15px #ff3030;
}

.yellow-car{
    background:
    linear-gradient(
        90deg,
        #ffd000,
        #aa7700,
        #ffd000
    );

    box-shadow:0 0 15px #ffd000;
}

.car-option h3{
    font-size:14px;
}

.lock{
    display:block;

    margin-top:6px;

    color:#ff5555;

    font-size:11px;
    font-weight:bold;
}

.unlocked{
    display:block;

    margin-top:6px;

    color:#00ff66;

    font-size:11px;
    font-weight:bold;
}

/* ================= START ================= */

.start{
    padding:15px 35px;

    border:none;
    border-radius:30px;

    background:#00eaff;

    color:#000;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px #00eaff;
}

.start:hover{
    transform:scale(1.05);

    box-shadow:
    0 0 25px #00eaff,
    0 0 45px rgba(0,234,255,.5);
}

/* ================= GAME OVER ================= */

.gameover{
    position:absolute;

    inset:0;

    z-index:60;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(10,0,0,.92);
}

.gameover-box{
    text-align:center;

    padding:35px;

    width:min(450px,90%);

    border:2px solid #ff3030;

    border-radius:25px;

    background:#100507;

    box-shadow:
    0 0 30px #ff3030;
}

.gameover-box h2{
    color:#ff3030;

    font-size:45px;

    text-shadow:
    0 0 20px #ff3030;

    margin-bottom:15px;
}

.gameover-box p{
    color:#bbb;
    margin-bottom:20px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .road{
        width:85vw;
    }

    .side{
        width:7.5vw;
    }

    .scenery{
        font-size:25px;
    }

    .house{
        font-size:28px;

    .tree{
        font-size:28px;

    .panel{
        padding:7px 9px;

    }

    .speed-box{
        top:60px;

    }

    .speed-number{
        font-size:25px;
    }

    .level-box{
        top:60px;
        left:8px;
        font-size:11px;
    }

    .control{
        width:68px;
        height:52px;
    }

    .car-option{
        width:95px;
    }

    .level-option{
        width:95px;
    }
}
</style>
</head>

<script>

/* =========================
VARIABLES
========================= */

const car =
document.getElementById("car");

const carBody =
document.getElementById("carBody");

const road =
document.getElementById("road");

const scoreText =
document.getElementById("score");

const coinsText =
document.getElementById("coins");

const speedNumber =
document.getElementById("speedNumber");

const levelText =
document.getElementById("levelText");

const menu =
document.getElementById("menu");

const gameover =
document.getElementById("gameover");

const finalScore =
document.getElementById("finalScore");

const carSound =
document.getElementById("carSound");

const leftSide =
document.getElementById("leftSide");

const rightSide =
document.getElementById("rightSide");


let carX = 50;

let score = 0;

let coins = 0;

let speed = 4;

let playing = false;

let nitroActive = false;

let enemies = [];

let coinObjects = [];

let lines = [];

let sceneryObjects = [];

let frame = 0;

let selectedCar = "sky";

let selectedLevel = "low";


/* =========================
LEVEL SETTINGS
========================= */

const levelSettings = {

    low:{
        speed:4,
        maxSpeed:120,
        spawn:85
    },

    medium:{
        speed:6,
        maxSpeed:200,
        spawn:65
    },

    high:{
        speed:8,
        maxSpeed:300,
        spawn:48
    }

};


/* =========================
ROAD LINES
========================= */

for(let i=0;i<8;i++){

    const line =
    document.createElement("div");

    line.className="line";

    line.style.top =
    (i*140-100)+"px";

    road.appendChild(line);

    lines.push(line);

}


/* =========================
ROAD SIDE SCENERY
========================= */

const scenery=[
    "🌳",
    "🌲",
    "🌴",
    "🏠",
    "🌳",
    "💡",
    "🌲",
    "🏡"
];


function createScenery(){

    const left =
    document.createElement("div");

    const right =
    document.createElement("div");


    const item1 =
    scenery[Math.floor(Math.random()*scenery.length)];

    const item2 =
    scenery[Math.floor(Math.random()*scenery.length)];


    left.className="scenery";

    right.className="scenery";


    if(item1==="🏠" || item1==="🏡"){
        left.classList.add("house");
    }else{
        left.classList.add("tree");
    }


    if(item2==="🏠" || item2==="🏡"){
        right.classList.add("house");
    }else{
        right.classList.add("tree");
    }


    left.textContent=item1;

    right.textContent=item2;


    left.style.top="-70px";

    right.style.top="-150px";


    left.style.left=
    (20+Math.random()*60)+"%";

    right.style.left=
    (20+Math.random()*60)+"%";


    leftSide.appendChild(left);

    rightSide.appendChild(right);


    sceneryObjects.push(left);

    sceneryObjects.push(right);
}


/* =========================
AUDIO
========================= */

let audioCtx=null;


function initAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}


function playClick(){

    initAudio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();


    osc.type="sine";

    osc.frequency.setValueAtTime(
        700,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1100,
        audioCtx.currentTime+.08
    );

    gain.gain.setValueAtTime(
        .12,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.08
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+.08
    );
}


function playCoin(){

    initAudio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.type="square";

    osc.frequency.setValueAtTime(
        800,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1400,
        audioCtx.currentTime+.12
    );

    gain.gain.setValueAtTime(
        .1,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.15
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+.15
    );
}


function playCrash(){

    initAudio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        180,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        45,
        audioCtx.currentTime+.45
    );

    gain.gain.setValueAtTime(
        .25,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.45
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+.45
    );
}


function playNitro(){

    initAudio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.type="triangle";

    osc.frequency.setValueAtTime(
        200,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        audioCtx.currentTime+.25
    );

    gain.gain.setValueAtTime(
        .08,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.3
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+.3
    );
}

CAR COLOR

    }


    if(selectedCar==="yellow"){

        carBody.style.background=
        "linear-gradient(90deg,#ffd000,#aa7700,#ffd000)";

        "0 0 12px #ffd000,0 0 35px #ffd000,0 0 60px rgba(255,208,0,.4)";

/* =========================
CAR SELECTION
========================= */

document
.querySelectorAll(".car-option")
.forEach(function(option){

    option.addEventListener(
        "click",
        function(){

            const required=
            Number(option.dataset.unlock || 0);


            if(score<required){

                playClick();

                alert(
                    "🔒 Car locked!\nNeed "+required+" score."
                );

                return;
            }


            document
            .querySelectorAll(".car-option")
            .forEach(function(item){

                item.classList.remove(
                    "selected"
                );

            });


            option.classList.add(
                "selected"
            );


            selectedCar=
            option.dataset.color;


            changeCar();

            playClick();
        }
    );
});


/* =========================
LEVEL SELECTION
========================= */

document
.querySelectorAll(".level-option")
.forEach(function(option){

    option.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".level-option")
            .forEach(function(item){

                item.classList.remove(
                    "selected"
                );

            });


            option.classList.add(

            );

            playClick();

});


/* =========================
GARAGE UPDATE
========================= */

function updateGarage(){

    document
    .querySelectorAll(".car-option")
    .forEach(function(option){

        const required=
        Number(option.dataset.unlock || 0);

        const lock=
        option.querySelector(".lock");


        if(required>0 && score>=required){

            option.classList.remove(
                "locked"
            );


            if(lock){

                lock.className=
                "unlocked";

                lock.textContent=
                "✓ UNLOCKED";
            }

        }
    });
}

/* =========================
START GAME
========================= */

function startGame(){

    menu.style.display="none";

    gameover.style.display="none";


    score=0;

    coins=0;

    speed=
    levelSettings[selectedLevel].speed;

    carX=50;

    frame=0;

    playing=true;

    nitroActive=false;


    scoreText.textContent="0";

    coinsText.textContent="0";

    speedNumber.textContent=
    Math.round(speed*20);


    levelText.textContent=
    selectedLevel.toUpperCase();


    enemies.forEach(function(e){
        e.remove();
    });


    coinObjects.forEach(function(c){
        c.remove();
    });


    sceneryObjects.forEach(function(s){
        s.remove();
    });


    enemies=[];

    coinObjects=[];

    sceneryObjects=[];


    changeCar();


    carSound.currentTime=0;

    carSound.volume=.55;


    carSound
    .play()
    .catch(function(){});


    requestAnimationFrame(
        gameLoop
    );
}

/* =========================
MOVEMENT
========================= */

function moveLeft(){

    if(!playing)return;

    carX-=5;

    if(carX<12){
        carX=12;
    }
}


function moveRight(){

    if(!playing)return;

    carX+=5;

    if(carX>88){
        carX=88;
    }
}


/* =========================
KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowLeft"){

            e.preventDefault();

            moveLeft();
        }


        if(e.key==="ArrowRight"){

            e.preventDefault();

            moveRight();
        }


        if(e.code==="Space"){

            e.preventDefault();

            if(!nitroActive){

                playNitro();
            }

            nitroActive=true;
        }
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.code==="Space"){

            nitroActive=false;
        }
    }
);

/* =========================

function createCoin(){

    20+Math.random()*60;

/* =========================
COLLISION
========================= */

function hit(a,b){

    const r1=
    a.getBoundingClientRect();

    const r2=
    b.getBoundingClientRect();


    return !(
        r1.right<r2.left ||
        r1.left>r2.right ||
        r1.bottom<r2.top ||
        r1.top>r2.bottom
    );
}


/* =========================
GAME LOOP
========================= */

function gameLoop(){

    if(!playing)return;

    frame++;


    const settings=
    levelSettings[selectedLevel];


    const currentSpeed=
    nitroActive
    ? speed*2
    : speed;


    /* =================
    SPEED METER
    ================= */

    let displaySpeed=
    Math.round(currentSpeed*20);


    if(displaySpeed>
       settings.maxSpeed){

        displaySpeed=
        settings.maxSpeed;
    }


    speedNumber.textContent=
    displaySpeed;


    /* =================
    NITRO FLAME
    ================= */

    const flames=
    document.querySelectorAll(
        ".nitro-flame"
    );


    flames.forEach(function(flame){

        flame.style.opacity=
        nitroActive ? "1" : "0";
    });


    /* =================
    ROAD
    ================= */

    lines.forEach(function(line){

        let top=
        parseFloat(line.style.top);


        top+=currentSpeed;


        if(top>
           window.innerHeight){

            top=-100;
        }


        line.style.top=
        top+"px";
    });


    /* =================
    SCENERY
    ================= */

    if(frame%45===0){

        createScenery();
    }


    sceneryObjects.forEach(
        function(item,index){

            let top=
            parseFloat(item.style.top);


            top+=currentSpeed*.75;


            item.style.top=
            top+"px";


            if(
                top>
                window.innerHeight+100
            ){

                item.remove();

                sceneryObjects.splice(
                    index,
                    1
                );
            }
        }
    );


    /* =================
    ENEMY SPAWN
    ================= */

    if(frame%settings.spawn===0){

        createEnemy();
    }


    /* =================
    COIN SPAWN
    ================= */

    if(frame%55===0){

        createCoin();
    }


    /* =================
    ENEMIES
    ================= */

    enemies.forEach(
        function(enemy,index){

            let top=
            parseFloat(
                enemy.style.top
            );


            top+=currentSpeed;


            enemy.style.top=
            top+"px";


            if(hit(car,enemy)){

                crash();
            }


            if(
                top>
                window.innerHeight+100
            ){

                enemy.remove();

                enemies.splice(
                    index,
                    1
                );


                score+=10;


                scoreText.textContent=
                score;


                updateGarage();
            }
        }
    );


    /* =================
    COINS
    ================= */

    coinObjects.forEach(
        function(coin,index){

            let top=
            parseFloat(
                coin.style.top
            );


            top+=currentSpeed;


            coin.style.top=
            top+"px";


            if(hit(car,coin)){

                playCoin();


                coin.remove();


                coinObjects.splice(
                    index,
                    1
                );


                coins++;

                score+=25;


                coinsText.textContent=
                coins;


                scoreText.textContent=
                score;


                updateGarage();
            }


            if(
                top>
                window.innerHeight+50
            ){

                coin.remove();

                coinObjects.splice(
                    index,
                    1
                );
            }
        }
    );


    /* =================
    PLAYER
    ================= */

    car.style.left=
    carX+"%";


    /* =================
    SPEED INCREASE
    ================= */

    if(frame%500===0){

        speed+=.5;


        if(
            speed*20>
            settings.maxSpeed
        ){

            speed=
            settings.maxSpeed/20;
        }
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
CRASH
========================= */

function crash(){

    if(!playing)return;


    playing=false;


    carSound.pause();


    playCrash();


    finalScore.textContent=
    score;


    updateGarage();


    gameover.style.display=
    "flex";
}

changeCar();

</script>
