<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>JAITISH RACING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#03040b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    touch-action:none;
}

/* TOP UI */
.top{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 18px;
    z-index:50;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,234,255,.25);
}

.logo{
    color:#00eaff;
    font-size:21px;
    font-weight:900;
    text-shadow:0 0 15px #00eaff;
}

.stats{
    display:flex;
    gap:10px;
    align-items:center;
}

.stat{
    padding:7px 10px;
    border:1px solid rgba(0,234,255,.45);
    border-radius:10px;
    background:rgba(0,0,0,.45);
    font-size:13px;
    box-shadow:0 0 12px rgba(0,234,255,.15);
}

#coinCount{
    color:#ffd700;
}

#score{
    color:#00eaff;
}

/* GAME */
.game{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:min(430px,100vw);
    height:calc(100vh - 70px);
    overflow:hidden;
    background:
        linear-gradient(
            90deg,
            #07131b 0%,
            #111 15%,
            #222 16%,
            #111 84%,
            #07131b 85%,
            #07131b 100%
        );
}

/* road */
.road{
    position:absolute;
    left:10%;
    width:80%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #202020,
            #080808 10%,
            #181818 50%,
            #080808 90%,
            #202020
        );
    border-left:4px solid #444;
    border-right:4px solid #444;
    overflow:hidden;
}

/* road glow */
.road::before,
.road::after{
    content:"";
    position:absolute;
    top:0;
    width:4px;
    height:100%;
    background:#00eaff;
    box-shadow:0 0 12px #00eaff;
}

.road::before{
    left:0;
}

.road::after{
    right:0;
}

/* lane lines */
.lane{
    position:absolute;
    width:7px;
    height:80px;
    background:white;
    opacity:.8;
    left:33.33%;
    box-shadow:0 0 8px rgba(255,255,255,.7);
}

.lane2{
    left:66.66%;
}

/* car */
.car{
    position:absolute;
    width:52px;
    height:92px;
    border-radius:13px 13px 8px 8px;
    z-index:20;
    transition:background .2s;
}

/* player car */
.player{
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(
        90deg,
        #005eff,
        #00bfff,
        #005eff
    );
    border:2px solid #00eaff;
    box-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.8);
}

/* windshield */
.player::before,
.enemy::before{
    content:"";
    position:absolute;
    left:9px;
    top:14px;
    width:34px;
    height:25px;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        #9ef6ff,
        #123c55
    );
    border:1px solid rgba(255,255,255,.5);
}

/* wheels */
.player::after,
.enemy::after{
    content:"";
    position:absolute;
    left:-6px;
    top:18px;
    width:5px;
    height:25px;
    border-radius:4px;
    background:#050505;
    box-shadow:
        59px 0 #050505,
        0 40px #050505,
        59px 40px #050505;
}

/* enemy */
.enemy{
    z-index:15;
    background:linear-gradient(
        90deg,
        #8b0000,
        #ff2020,
        #8b0000
    );
    border:2px solid #ff3838;
    box-shadow:0 0 15px rgba(255,30,30,.65);
}

/* car colors */
.car.green{
    background:linear-gradient(
        90deg,
        #00a84f,
        #00ff72,
        #00a84f
    );
    border-color:#00ff72;
    box-shadow:0 0 18px #00ff72;
}

.car.yellow{
    background:linear-gradient(
        90deg,
        #b88a00,
        #ffe600,
        #b88a00
    );
    border-color:#ffe600;
    box-shadow:0 0 18px #ffe600;
}

.car.pink{
    background:linear-gradient(
        90deg,
        #b00065,
        #ff3da8,
        #b00065
    );
    border-color:#ff5db8;
    box-shadow:0 0 18px #ff3da8;
}

.car.gold{
    background:linear-gradient(
        90deg,
        #8d6500,
        #ffd700,
        #fff2a0,
        #a36f00
    );
    border-color:#ffd700;
    box-shadow:
        0 0 15px #ffd700,
        0 0 30px rgba(255,215,0,.65);
}

/* coins */
.coin{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff6a0,
            #ffd700 35%,
            #d99b00 70%,
            #8c5f00
        );
    border:2px solid #fff1a0;
    box-shadow:
        0 0 8px #ffd700,
        0 0 20px rgba(255,215,0,.7);
    z-index:18;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#6d4900;
    font-weight:900;
    font-size:12px;
}

.coin::after{
    content:"$";
}

/* nitro */
.nitro{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:10px;
    border:1px solid #00eaff;
    border-radius:20px;
    overflow:hidden;
    z-index:40;
    background:#001014;
}

.nitroFill{
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        #00eaff,
        #008cff,
        #00eaff
    );
    box-shadow:0 0 15px #00eaff;
}

/* car selection */
.garage{
    position:absolute;
    bottom:28px;
    right:8px;
    z-index:45;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.garage button{
    width:42px;
    height:34px;
    border:1px solid #00eaff;
    border-radius:8px;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:10px;
    cursor:pointer;
}

.garage button.locked{
    border-color:#555;
    color:#777;
}

.garage button.active{
    background:#00eaff;
    color:#001014;
}

/* start/game over */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.panel{
    width:min(350px,90%);
    padding:28px 20px;
    border:1px solid #00eaff;
    border-radius:20px;
    background:rgba(4,10,18,.94);
    box-shadow:
        0 0 25px rgba(0,234,255,.25);
}

.panel h1{
    color:#00eaff;
    text-shadow:0 0 15px #00eaff;
    margin-bottom:10px;
}

.panel p{
    color:#ccc;
    margin:8px 0;
}

.startBtn{
    margin-top:18px;
    padding:13px 28px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    color:#001014;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,234,255,.7);
}

/* unlock notification */
.unlock{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:90;
    padding:12px 20px;
    border-radius:14px;
    background:rgba(0,0,0,.85);
    border:1px solid #ffd700;
    color:#ffd700;
    box-shadow:0 0 20px rgba(255,215,0,.5);
    font-weight:bold;
    display:none;
    text-align:center;
}

/* mobile hint */
.hint{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    font-size:11px;
    z-index:30;
    pointer-events:none;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div class="top">
    <div class="logo">🏁 JAITISH RACING</div>

    <div class="stats">
        <div class="stat">
            SCORE <span id="score">0</span>
        </div>

        <div class="stat" id="coinCount">
            🪙 <span id="coins">0</span>
        </div>
    </div>
</div>

<div class="game" id="game">

    <div class="road" id="road">

        <div class="lane" id="lane1"></div>
        <div class="lane lane2" id="lane2"></div>

        <div class="car player" id="player"></div>

    </div>

    <div class="unlock" id="unlock"></div>

    <div class="garage">
        <button id="blueBtn" class="active">BLUE</button>
        <button id="greenBtn" class="locked">🔒100</button>
        <button id="yellowBtn" class="locked">🔒250</button>
        <button id="pinkBtn" class="locked">🔒350</button>
        <button id="goldBtn" class="locked">🔒400</button>
    </div>

    <div class="nitro">
        <div class="nitroFill" id="nitroFill"></div>
    </div>

    <div class="hint">
        Swipe ← → or use keyboard arrows
    </div>

    <div class="overlay" id="startScreen">
        <div class="panel">

            <h1>🏎️ JAITISH RACING</h1>

            <p>🔥 Dodge cars • Collect coins</p>
            <p>⚡ Use Nitro • Unlock new cars</p>

            <p>
                🪙 Coins:
                <b id="startCoins">0</b>
            </p>

            <button class="startBtn" id="startBtn">
                START RACE 🚀
            </button>

        </div>
    </div>

    <div class="overlay hidden" id="gameOver">
        <div class="panel">

            <h1>💥 GAME OVER</h1>

            <p>
                Score:
                <b id="finalScore">0</b>
            </p>

            <p>
                🪙 Coins:
                <b id="finalCoins">0</b>
            </p>

            <p>
                🏆 Best:
                <b id="bestScore">0</b>
            </p>

            <button class="startBtn" id="restartBtn">
                PLAY AGAIN 🔥
            </button>

        </div>
    </div>

</div>

<script>
/* =========================
   JAITISH RACING ENGINE
========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");

const startCoinsEl = document.getElementById("startCoins");
const finalScoreEl = document.getElementById("finalScore");
const finalCoinsEl = document.getElementById("finalCoins");
const bestScoreEl = document.getElementById("bestScore");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const nitroFill = document.getElementById("nitroFill");
const unlockBox = document.getElementById("unlock");

let running = false;

let score = 0;
let coins = 0;
let bestScore = 0;

let speed = 5;
let playerX = 50;

let enemies = [];
let coinObjects = [];

let animationId = null;
let enemyTimer = 0;
let coinTimer = 0;

let nitro = 100;
let nitroActive = false;

let currentCar = "blue";

/* =========================
   SOUND SYSTEM
========================= */

let audioContext = null;
let engineOscillator = null;
let engineGain = null;

function initAudio(){

    if(!audioContext){
        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}

function beep(freq, duration, type="sine", volume=.08){

    if(!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime + duration);
}

/* coin sound */
function coinSound(){

    beep(700,.08,"square",.08);

    setTimeout(()=>{
        beep(1000,.12,"square",.08);
    },60);
}

/* unlock sound */
function unlockSound(){

    beep(500,.12,"sine",.1);

    setTimeout(()=>{
        beep(750,.12,"sine",.1);
    },100);

    setTimeout(()=>{
        beep(1100,.2,"sine",.1);
    },200);
}

/* crash */
function crashSound(){

    beep(100,.35,"sawtooth",.18);

    setTimeout(()=>{
        beep(55,.45,"sawtooth",.12);
    },100);
}

/* start */
function startSound(){

    beep(300,.1,"square",.08);

    setTimeout(()=>{
        beep(500,.1,"square",.08);
    },120);

    setTimeout(()=>{
        beep(800,.18,"square",.08);
    },240);
}

/* =========================
   ENGINE SOUND
========================= */

function startEngine(){

    if(!audioContext) return;

    stopEngine();

    engineOscillator =
        audioContext.createOscillator();

    engineGain =
        audioContext.createGain();

    engineOscillator.type = "sawtooth";

    engineOscillator.frequency.value = 70;

    engineGain.gain.value = .025;

    engineOscillator.connect(engineGain);

    engineGain.connect(
        audioContext.destination
    );

    engineOscillator.start();
}

function updateEngine(){

    if(
        !engineOscillator ||
        !audioContext
    ) return;

    engineOscillator.frequency.value =
        65 + speed * 9;
}

function stopEngine(){

    if(engineOscillator){

        try{
            engineOscillator.stop();
        }catch(e){}

        engineOscillator.disconnect();
        engineOscillator = null;
    }
}

/* =========================
   LOCAL SAVE
========================= */

function loadSave(){

    try{

        bestScore =
            Number(localStorage.getItem(
                "jaitish_best"
            )) || 0;

        coins =
            Number(localStorage.getItem(
                "jaitish_coins"
            )) || 0;

    }catch(e){

        bestScore = 0;
        coins = 0;
    }

    updateUI();
}

function saveGame(){

    try{

        localStorage.setItem(
            "jaitish_best",
            bestScore
        );

        localStorage.setItem(
            "jaitish_coins",
            coins
        );

    }catch(e){}
}

/* =========================
   CAR UNLOCKS
========================= */

const carData = {

    blue:{
        score:0,
        className:""
    },

    green:{
        score:100,
        className:"green"
    },

    yellow:{
        score:250,
        className:"yellow"
    },

    pink:{
        score:350,
        className:"pink"
    },

    gold:{
        score:400,
        className:"gold"
    }

};

function isUnlocked(car){

    return score >= carData[car].score;
}

function updateGarage(){

    const buttons = {

        blue:
        document.getElementById("blueBtn"),

        green:
        document.getElementById("greenBtn"),

        yellow:
        document.getElementById("yellowBtn"),

        pink:
        document.getElementById("pinkBtn"),

        gold:
        document.getElementById("goldBtn")
    };

    for(const name in buttons){

        const btn = buttons[name];

        const unlocked =
            score >= carData[name].score;

        if(unlocked){

            btn.classList.remove("locked");

            if(name !== "blue"){
                btn.textContent =
                    name.toUpperCase();
            }

        }else{

            btn.classList.add("locked");

            if(name !== "blue"){
                btn.textContent =
                    "🔒" + carData[name].score;
            }
        }

        btn.classList.toggle(
            "active",
            currentCar === name
        );
    }
}

function selectCar(name){

    if(!isUnlocked(name)){

        showUnlock(
            "🔒 Score " +
            carData[name].score +
            " required!"
        );

        beep(180,.15,"square",.05);

        return;
    }

    currentCar = name;

    player.className =
        "car player";

    if(carData[name].className){
        player.classList.add(
            carData[name].className
        );
    }

    updateGarage();

    beep(500,.1,"sine",.05);
}

/* buttons */

document.getElementById("blueBtn")
.addEventListener(
    "click",
    ()=>selectCar("blue")
);

document.getElementById("greenBtn")
.addEventListener(
    "click",
    ()=>selectCar("green")
);

document.getElementById("yellowBtn")
.addEventListener(
    "click",
    ()=>selectCar("yellow")
);

document.getElementById("pinkBtn")
.addEventListener(
    "click",
    ()=>selectCar("pink")
);

document.getElementById("goldBtn")
.addEventListener(
    "click",
    ()=>selectCar("gold")
);

/* =========================
   UI
========================= */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    coinsEl.textContent =
        coins;

    startCoinsEl.textContent =
        coins;

    updateGarage();
}

function showUnlock(message){

    unlockBox.textContent =
        message;

    unlockBox.style.display =
        "block";

    setTimeout(()=>{
        unlockBox.style.display =
            "none";
    },2200);
}

/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

    const enemy =
        document.createElement("div");

    enemy.className =
        "car enemy";

    const lanes = [16.5,50,83.5];

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];

    enemy.style.left =
        lane + "%";

    enemy.style.top =
        "-110px";

    road.appendChild(enemy);

    enemies.push({
        el:enemy,
        y:-110,
        speed:
            speed +
            Math.random()*2
    });
}

/* =========================
   SPAWN COIN
========================= */

function spawnCoin(){

    const coin =
        document.createElement("div");

    coin.className =
        "coin";

    const lanes = [16.5,50,83.5];

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];

    coin.style.left =
        "calc(" +
        lane +
        "% - 13px)";

    coin.style.top =
        "-40px";

    road.appendChild(coin);

    coinObjects.push({
        el:coin,
        y:-40,
        speed:speed
    });
}

/* =========================
   COLLISION
========================= */

function rectsOverlap(a,b){

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}

/* =========================
   SCORE UNLOCK CHECK
========================= */

let lastUnlockScore = 0;

function checkUnlocks(){

    const unlockLevels = [
        {
            score:100,
            car:"green",
            name:"TAXI GREEN 🚕"
        },
        {
            score:250,
            car:"yellow",
            name:"TAXI YELLOW 🚕"
        },
        {
            score:350,
            car:"pink",
            name:"PINK CAR 💗"
        },
        {
            score:400,
            car:"gold",
            name:"GOLDEN CAR 🏆"
        }
    ];

    for(const item of unlockLevels){

        if(
            score >= item.score &&
            lastUnlockScore < item.score
        ){

            showUnlock(
                "🎉 " +
                item.name +
                " UNLOCKED!"
            );

            unlockSound();

            lastUnlockScore =
                item.score;
        }
    }
}

/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!running) return;

    /* score */
    score += .08;

    /* speed */
    speed =
        Math.min(
            11,
            5 + score / 180
        );

    /* engine */
    updateEngine();

    /* lanes */
    const lanes =
        document.querySelectorAll(
            ".lane"
        );

    lanes.forEach(
        lane => {

            let top =
                parseFloat(
                    lane.dataset.y || -100
                );

            top += speed;

            if(top > road.offsetHeight){
                top = -100;
            }

            lane.dataset.y = top;

            lane.style.top =
                top + "px";
        }
    );

    /* enemy timer */
    enemyTimer++;

    if(
        enemyTimer >
        Math.max(
            35,
            75 - score / 10
        )
    ){

        spawnEnemy();

        enemyTimer = 0;
    }

    /* coin timer */
    coinTimer++;

    if(coinTimer > 65){

        spawnCoin();

        coinTimer = 0;
    }

    /* enemies */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];

        enemy.y +=
            enemy.speed;

        enemy.el.style.top =
            enemy.y + "px";

        if(
            rectsOverlap(
                player,
                enemy.el
            )
        ){

            endGame();
            return;
        }

        if(
            enemy.y >
            road.offsetHeight + 120
        ){

            enemy.el.remove();

            enemies.splice(i,1);
        }
    }

    /* coins */

    for(
        let i=coinObjects.length-1;
        i>=0;
        i--
    ){

        const coin =
            coinObjects[i];

        coin.y +=
            coin.speed;

        coin.el.style.top =
            coin.y + "px";

        if(
            rectsOverlap(
                player,
                coin.el
            )
        ){

            coins++;

            coinSound();

            coin.el.remove();

            coinObjects.splice(i,1);

            saveGame();
        }

        else if(
            coin.y >
            road.offsetHeight + 50
        ){

            coin.el.remove();

            coinObjects.splice(i,1);
        }
    }

    /* nitro */

    if(nitroActive){

        nitro -= .8;

        if(nitro <= 0){

            nitro = 0;

            nitroActive = false;
        }
    }else{

        nitro += .08;

        if(nitro > 100)
            nitro = 100;
    }

    nitroFill.style.width =
        nitro + "%";

    /* unlocks */
    checkUnlocks();

    updateUI();

    animationId =
        requestAnimationFrame(update);
}

/* =========================
   START GAME
========================= */

function startGame(){

    initAudio();

    startSound();

    running = true;

    score = 0;

    speed = 5;

    nitro = 100;

    playerX = 50;

    lastUnlockScore = 0;

    player.style.left =
        playerX + "%";

    enemies.forEach(
        e=>e.el.remove()
    );

    coinObjects.forEach(
        c=>c.el.remove()
    );

    enemies = [];

    coinObjects = [];

    enemyTimer = 0;

    coinTimer = 0;

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    startEngine();

    cancelAnimationFrame(
        animationId
    );

    update();
}

/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!running) return;

    running = false;

    cancelAnimationFrame(
        animationId
    );

    stopEngine();

    crashSound();

    if(score > bestScore){

        bestScore =
            Math.floor(score);
    }

    saveGame();

    finalScoreEl.textContent =
        Math.floor(score);

    finalCoinsEl.textContent =
        coins;

    bestScoreEl.textContent =
        bestScore;

    gameOverScreen.classList.remove(
        "hidden"
    );
}

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ){

            e.preventDefault();
        }

        if(
            e.key === "ArrowLeft"
        ){

            movePlayer(-5);
        }

        if(
            e.key === "ArrowRight"
        ){

            movePlayer(5);
        }

        /* nitro */
        if(
            e.code === "Space"
        ){

            nitroActive = true;
        }
    }
);

document.addEventListener(
    "keyup",
    function(e){

        if(
            e.code === "Space"
        ){

            nitroActive = false;
        }
    }
);

/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(amount){

    if(!running) return;

    playerX += amount;

    playerX =
        Math.max(
            16.5,
            Math.min(
                83.5,
                playerX
            )
        );

    player.style.left =
        playerX + "%";
}

/* =========================
   SWIPE CONTROL
========================= */

let touchStartX = 0;
let lastTouchX = 0;

game.addEventListener(
    "touchstart",
    function(e){

        if(!running) return;

        touchStartX =
            e.touches[0].clientX;

        lastTouchX =
            touchStartX;
    },
    {passive:false}
);

game.addEventListener(
    "touchmove",
    function(e){

        if(!running) return;

        e.preventDefault();

        const currentX =
            e.touches[0].clientX;

        const difference =
            currentX - lastTouchX;

        if(
            Math.abs(difference) > 1
        ){

            movePlayer(
                difference * .12
            );
        }

        lastTouchX =
            currentX;

    },
    {passive:false}
);

game.addEventListener(
    "touchend",
    function(){

        lastTouchX = 0;

    },
    {passive:false}
);

/* =========================
   BUTTONS
========================= */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

/* =========================
   LOAD
========================= */

loadSave();

updateGarage();

</script>
