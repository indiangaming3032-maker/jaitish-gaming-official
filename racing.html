<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JAITISH NEON RACING</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#02040a;
font-family:Arial,sans-serif;
touch-action:none
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:radial-gradient(circle,#14213d,#050711 60%,#010207)
}

.hud{
position:absolute;
top:10px;
left:10px;
right:10px;
z-index:100;
display:flex;
justify-content:space-between;
gap:6px
}

.box{
padding:7px 10px;
border:1px solid #00eaff;
border-radius:10px;
background:rgba(0,10,25,.85);
color:white;
box-shadow:0 0 12px #00eaff;
font-size:13px
}

.speed{
position:absolute;
top:60px;
left:50%;
transform:translateX(-50%);
z-index:100;
padding:7px 13px;
border:1px solid #00ff88;
border-radius:10px;
background:#00150c;
color:#00ff88;
box-shadow:0 0 12px #00ff88;
font-weight:bold
}

.road{
position:absolute;
left:0;
top:0;
width:100vw;
height:100vh;
background:linear-gradient(
90deg,#101010 0%,#252525 20%,#303030 50%,#252525 80%,#101010 100%
);
border-left:6px solid #00eaff;
border-right:6px solid #00eaff;
box-shadow:0 0 18px #00eaff,inset 0 0 50px #000
}

.line{
position:absolute;
width:7px;
height:90px;
background:white;
left:33.33%;
box-shadow:0 0 12px white
}

.line2{left:66.66%}

.player{
position:absolute;
width:66px;
height:105px;
left:50%;
bottom:115px;
transform:translateX(-50%);
z-index:60;
border-radius:18px 18px 10px 10px;
background:linear-gradient(90deg,#00d9ff,#0077ff,#00d9ff);
box-shadow:0 0 15px #00eaff,0 0 35px #008cff
}

.player:before{
content:"";
position:absolute;
top:12px;
left:10px;
width:46px;
height:30px;
border-radius:8px;
background:#07101d;
border:2px solid #00eaff
}

.player:after{
content:"🏎️";
position:absolute;
font-size:43px;
left:9px;
top:39px
}

.enemy{
position:absolute;
width:60px;
height:95px;
border-radius:15px;
z-index:50;
background:linear-gradient(90deg,#ff2222,#700000,#ff2222);
box-shadow:0 0 20px red
}

.enemy:after{
content:"🚗";
position:absolute;
font-size:39px;
left:8px;
top:28px
}

.coin{
position:absolute;
font-size:30px;
z-index:45;
filter:drop-shadow(0 0 10px gold)
}

.tree,.house,.light{
position:absolute;
z-index:20
}

.tree{
font-size:40px;
filter:drop-shadow(0 0 8px #00ff88)
}

.house{font-size:38px}

.light{
font-size:30px;
filter:drop-shadow(0 0 12px yellow)
}

.controls{
position:absolute;
left:0;
right:0;
bottom:12px;
z-index:150;
display:flex;
justify-content:center;
gap:12px
}

.control{
width:72px;
height:56px;
border:2px solid #00eaff;
border-radius:15px;
background:rgba(0,15,30,.95);
color:white;
font-size:27px;
box-shadow:0 0 15px #00eaff;
touch-action:manipulation;
user-select:none
}

.control
