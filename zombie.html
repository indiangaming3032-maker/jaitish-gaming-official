
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAITISH ZOMBIE ESCAPE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05090c;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;
justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.panel{background:#07151bdc;border:1px solid #20e6c1;padding:10px 14px;
border-radius:10px;box-shadow:0 0 12px #00bba055}
#intro{position:fixed;inset:0;background:#02080be8;display:grid;
place-items:center;text-align:center;padding:20px}
#intro section{max-width:480px}
h1{color:#20e6c1;text-shadow:0 0 20px #00bfa5}
button{background:#12d6b0;color:#00120f;border:0;border-radius:10px;
padding:13px 22px;font-weight:bold;font-size:16px;cursor:pointer}
#help{position:fixed;bottom:12px;left:12px;background:#061219d9;
padding:10px;border-radius:9px;font-size:13px}
#mobile{position:fixed;bottom:12px;right:12px;display:grid;
grid-template-columns:repeat(3,48px);gap:5px}
#mobile button{padding:10px 0;background:#092b30;color:white;
border:1px solid #20e6c1;touch-action:none}
@media(pointer:fine){#mobile{opacity:.45}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">💎 Crystals: <b id="score">0</b></div>
 <div class="panel">❤️ Health: <b id="health">100</b></div>
 <div class="panel">⏱ Time: <b id="time">0</b>s</div>
</div>
<div id="help">WASD / Arrow keys: Move · Mouse: Look · Collect crystals!</div>
<div id="mobile">
 <span></span><button data-key="w">▲</button><span></span>
 <button data-key="a">◀</button><button data-key="s">▼</button>
 <button data-key="d">▶</button>
</div>
<div id="intro">
 <section>
  <h1>JAITISH ZOMBIE ESCAPE</h1>
  <p>Enter the abandoned city. Avoid the zombies and collect glowing crystals to survive!</p>
  <p>Move with WASD or arrow keys. Move the mouse to look around.</p>
  <button id="start">START SURVIVAL</button>
  <p id="status">3D Survival Mission</p>
 </section>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const canvas=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x09141b);
scene.fog=new THREE.FogExp2(0x09141b,.023);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,250);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

scene.add(new THREE.HemisphereLight(0x91b9d0,0x171b1b,2));
const moon=new THREE.DirectionalLight(0xa5d5ff,2.5);
moon.position.set(-12,25,8);
moon.castShadow=true;
scene.add(moon);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(220,220),
 new THREE.MeshStandardMaterial({color:0x202a2a,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(220,90,0x214b50,0x293638);
grid.position.y=.015;
scene.add(grid);

const buildings=[];
function building(x,z,w,h,d){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:new THREE.Color().setHSL(.55, .13, .12+Math.random()*.1),
   roughness:.92
  })
 );
 mesh.position.set(x,h/2,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 buildings.push({x,z,w,d});
 // Dim windows on the front face
 for(let yy=1.5;yy<h-1;yy+=2.5){
  for(let xx=-w/2+1;xx<w/2-0.4;xx+=2){
   if(Math.random()<.65)continue;
   const win=new THREE.Mesh(
    new THREE.PlaneGeometry(.65,.9),
    new THREE.MeshBasicMaterial({color:Math.random()<.5?0x385c61:0x75633d})
   );
   win.position.set(x+xx,yy,z-d/2-.012);
   scene.add(win);
  }
}
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*180;
 const z=(Math.random()-.5)*180;
 if(Math.abs(x)<13&&Math.abs(z)<18)continue;
 building(x,z,5+Math.random()*8,5+Math.random()*18,5+Math.random()*8);
}

const player=new THREE.Vector3(0,1.7,7);
let yaw=0,pitch=0,playing=false,health=100,score=0;
let startTime=0,lastTime=0,damageClock=0;
const keys={};
const zombies=[],crystals=[];
const clock=new THREE.Clock();

function zombie(x,z){
 const g=new THREE.Group();
 const skin=new THREE.MeshStandardMaterial({color:0x61775a,roughness:1});
 const cloth=new THREE.MeshStandardMaterial({color:0x3a4540,roughness:1});
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),skin);
 head.position.y=1.62;g.add(head);
 const body=new THREE.Mesh(new THREE.BoxGeometry(.62,.8,.36),cloth);
 body.position.y=1.02;g.add(body);
 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.2,.65,.23),cloth);
  leg.position.set(side*.19,.38,0);g.add(leg);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.2),skin);
  arm.position.set(side*.43,1.03,0);g.add(arm);
 }
 const eyeMat=new THREE.MeshBasicMaterial({color:0xff392c});
 for(const side of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),eyeMat);
  eye.position.set(side*.13,1.68,-.26);g.add(eye);
 }
 g.position.set(x,0,z);
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});
 scene.add(g);
 zombies.push({g,speed:1+Math.random()*.45,phase:Math.random()*6});
}
for(let i=0;i<13;i++){
 let a=Math.random()*Math.PI*2,r=13+Math.random()*48;
 zombie(Math.sin(a)*r,Math.cos(a)*r);
}

function crystal(x,z){
 const g=new THREE.Mesh(
  new THREE.OctahedronGeometry(.48),
  new THREE.MeshStandardMaterial({
   color:0x24ffe1,emissive:0x00bfa5,emissiveIntensity:2,
   metalness:.25,roughness:.22
  })
 );
 g.position.set(x,.85,z);
 scene.add(g);
 crystals.push(g);
}
for(let i=0;i<18;i++){
 crystal((Math.random()-.5)*100,(Math.random()-.5)*100);
}

function updateHud(t){
 document.querySelector('#score').textContent=score;
 document.querySelector('#health').textContent=Math.max(0,Math.round(health));
 document.querySelector('#time').textContent=t;
}
function reset(){
 player.set(0,1.7,7);yaw=0;pitch=0;health=100;score=0;
 startTime=performance.now();damageClock=0;
 for(const z of zombies)scene.remove(z.g);
 zombies.length=0;
 for(let i=0;i<13;i++){
  let a=Math.random()*Math.PI*2,r=13+Math.random()*48;
  zombie(Math.sin(a)*r,Math.cos(a)*r);
 }
 for(const c of crystals)scene.remove(c);
 crystals.length=0;
 for(let i=0;i<18;i++)crystal((Math.random()-.5)*100,(Math.random()-.5)*100);
 updateHud(0);
}

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])
  b.addEventListener(ev,()=>keys[k]=false);
});

canvas.addEventListener('click',()=>{
 if(playing&&document.pointerLockElement!==canvas&&innerWidth>700)canvas.requestPointerLock?.();
});
addEventListener('mousemove',e=>{
 if(playing&&document.pointerLockElement===canvas){
  yaw-=e.movementX*.002;
  pitch=Math.max(-1.15,Math.min(1.15,pitch-e.movementY*.002));
 }
});
addEventListener('contextmenu',e=>e.preventDefault());

function endGame(message){
 playing=false;
 document.exitPointerLock?.();
 document.querySelector('#intro').style.display='grid';
 document.querySelector('#start').textContent='PLAY AGAIN';
 document.querySelector('#status').textContent=message+' | Crystals collected: '+score;
}
document.querySelector('#start').addEventListener('click',()=>{
 reset();playing=true;lastTime=performance.now();
 document.querySelector('#intro').style.display='none';
 if(innerWidth>700)canvas.requestPointerLock?.();
});

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(playing){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let move=new THREE.Vector3();
  if(keys.w||keys.arrowup)move.add(forward);
  if(keys.s||keys.arrowdown)move.sub(forward);
  if(keys.a||keys.arrowleft)move.sub(right);
  if(keys.d||keys.arrowright)move.add(right);
  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5.2*dt);
   player.add(move);
  }
  player.x=THREE.MathUtils.clamp(player.x,-95,95);
  player.z=THREE.MathUtils.clamp(player.z,-95,95);

  camera.position.copy(player);
  camera.rotation.set(pitch,yaw,0,'YXZ');

  for(const z of zombies){
   const dx=player.x-z.g.position.x;
   const dz=player.z-z.g.position.z;
   const dist=Math.hypot(dx,dz);
   if(dist>.9){
    z.g.position.x+=dx/dist*z.speed*dt;
    z.g.position.z+=dz/dist*z.speed*dt;
    z.g.rotation.y=Math.atan2(dx,dz);
    z.g.position.y=Math.abs(Math.sin(now*.006+z.phase))*.07;
   }else if(now-damageClock>650){
    health-=9;damageClock=now;
    if(health<=0){health=0;updateHud(Math.floor((now-startTime)/1000));endGame('MISSION FAILED');}
   }
  }
  for(let i=crystals.length-1;i>=0;i--){
   const c=crystals[i];
   c.rotation.y+=dt*1.5;c.rotation.x+=dt*.5;
   if(c.position.distanceTo(player)<1.8){
    scene.remove(c);crystals.splice(i,1);score++;
    if(crystals.length===0){
     for(let j=0;j<18;j++)crystal((Math.random()-.5)*100,(Math.random()-.5)*100);
    }
   }
  }
  updateHud(Math.floor((now-startTime)/1000));
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
