<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAITISH REACTION TEST</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#03040b;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.game{
    width:min(900px,94%);
    text-align:center;
}

.logo{
    color:#00eaff;
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
    text-shadow:0 0 15px #00eaff;
}

.subtitle{
    color:#888;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:15px 10px;
    border:1px solid #163746;
    border-radius:15px;
    background:#071018;
}

.stat span{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}

.stat strong{
    color:#00eaff;
    font-size:22px;
}

.arena{
    min-height:420px;
    border:2px solid #00eaff;
    border-radius:28px;
    background:
        radial-gradient(circle at center,#09232b 0%,#050910 45%,#020307 100%);
    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 50px rgba(0,234,255,.08);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.arena.waiting{
    border-color:#ffe600;
    box-shadow:
        0 0 25px #ffe600,
        inset 0 0 50px rgba(255,230,0,.08);
}

.arena.go{
    border-color:#39ff14;
    background:
        radial-gradient(circle,#123d0d 0%,#061006 50%,#020307 100%);
    box-shadow:
        0 0 35px #39ff14,
        inset 0 0 70px rgba(57,255,20,.15);
}

.arena.danger{
    border-color:#ff1744;
    box-shadow:
        0 0 30px #ff1744,
        inset 0 0 60px rgba(255,23,68,.12);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

.status{
    font-size:42px;
    font-weight:bold;
    letter-spacing:2px;
    color:#00eaff;
    text-shadow:0 0 15px currentColor;
}

.message{
    margin-top:12px;
    color:#aaa;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:14px 30px;
    border:2px solid #00eaff;
    border-radius:30px;
    background:#06141b;
    color:#00eaff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #00eaff;
    transition:.25s;
}

button:hover{
    background:#00eaff;
    color:#020307;
    transform:scale(1.05);
}

.result{
    margin-top:18px;
    min-height:28px;
    color:#aaa;
}

.rank{
    color:#ffe600;
    font-weight:bold;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .stat{
        padding:12px 5px;
    }

    .stat strong{
        font-size:18px;
    }

    .arena{
        min-height:430px;
    }

    .status{
        font-size:30px;
    }

    .icon{
        font-size:58px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="logo">🎮 JAITISH GAMING</div>

    <div class="subtitle">
        ⚡ ULTIMATE REACTION CHALLENGE
    </div>

    <div class="stats">

        <div class="stat">
            <span>LEVEL</span>
            <strong id="level">1/10</strong>
        </div>

        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>BEST</span>
            <strong id="best">—</strong>
        </div>

    </div>

    <div id="arena" class="arena">

        <div class="icon" id="icon">⚡</div>

        <div class="status" id="status">
            READY?
        </div>

        <div class="message" id="message">
            Press START to begin the challenge
        </div>

        <button id="startButton">
            🚀 START GAME
        </button>

    </div>

    <div class="result" id="result"></div>

</div>

<script>

const arena = document.getElementById("arena");
const icon = document.getElementById("icon");
const statusText = document.getElementById("status");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");

const levelText = document.getElementById("level");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const result = document.getElementById("result");

let level = 1;
let score = 0;
let best = Number(localStorage.getItem("jaitishReactionBest")) || 0;

let state = "idle";
let startTime = 0;
let timer = null;

bestText.textContent = best ? best : "—";

function resetScreen(){

    clearTimeout(timer);

    level = 1;
    score = 0;
    state = "idle";

    levelText.textContent = "1/10";
    scoreText.textContent = "0";

    arena.className = "arena";

    icon.textContent = "⚡";
    statusText.textContent = "READY?";
    statusText.style.color = "#00eaff";

    message.textContent = "Press START to begin the challenge";

    startButton.style.display = "inline-block";
    startButton.textContent = "🚀 START GAME";

    result.textContent = "";
}

function startGame(){

    level = 1;
    score = 0;

    scoreText.textContent = "0";
    levelText.textContent = "1/10";

    startButton.style.display = "none";

    nextRound();
}

function nextRound(){

    clearTimeout(timer);

    state = "waiting";

    arena.className = "arena waiting";

    icon.textContent = "🟡";
    statusText.textContent = "WAIT...";
    statusText.style.color = "#ffe600";

    message.textContent = "Don't tap yet!";

    const delay = Math.max(900, 1900 - level * 80);

    timer = setTimeout(goSignal, delay);
}

function goSignal(){

    state = "go";

    arena.className = "arena go";

    icon.textContent = "🟢";
    statusText.textContent = "TAP NOW!";
    statusText.style.color = "#39ff14";

    message.textContent = "GO! GO! GO!";

    startTime = performance.now();
}

function handleAction(){

    if(state === "idle"){
        return;
    }

    if(state === "waiting"){

        clearTimeout(timer);

        state = "early";

        arena.className = "arena danger";

        icon.textContent = "❌";
        statusText.textContent = "TOO EARLY!";
        statusText.style.color = "#ff1744";

        message.textContent = "You clicked before the signal.";

        score = Math.max(0, score - 25);

        scoreText.textContent = score;

        setTimeout(nextRound,900);

        return;
    }

    if(state === "go"){

        const reaction = Math.round(performance.now() - startTime);

        state = "result";

        let points;

        if(reaction < 180){
            points = 150;
        }
        else if(reaction < 250){
            points = 120;
        }
        else if(reaction < 350){
            points = 90;
        }
        else if(reaction < 500){
            points = 60;
        }
        else{
            points = 30;
        }

        score += points;

        scoreText.textContent = score;

        if(!best || reaction < best){

            best = reaction;

            localStorage.setItem(
                "jaitishReactionBest",
                best
            );

            bestText.textContent = best;
        }

        arena.className = "arena";

        icon.textContent = "⚡";
        statusText.textContent = reaction + " ms";
        statusText.style.color = "#00eaff";

        message.textContent =
            "+" + points + " points";

        if(level >= 10){

            finishGame();

        }
        else{

            level++;

            levelText.textContent =
                level + "/10";

            setTimeout(nextRound,900);
        }
    }
}

function finishGame(){

    state = "finished";

    arena.className = "arena";

    icon.textContent = "🏆";
    statusText.textContent = "CHALLENGE COMPLETE!";
    statusText.style.color = "#ffe600";

    let rank = "ROOKIE";

    if(score >= 1100){
        rank = "⚡ LEGEND";
    }
    else if(score >= 850){
        rank = "🔥 MASTER";
    }
    else if(score >= 600){
        rank = "💎 PRO";
    }

    message.innerHTML =
        "Final Score: <b>" +
        score +
        "</b><br><br>" +
        "<span class='rank'>" +
        rank +
        "</span>";

    startButton.style.display = "inline-block";
    startButton.textContent = "🔄 PLAY AGAIN";

    result.textContent =
        "10 levels completed! Try to beat your best reaction time.";
}

startButton.addEventListener("click", function(event){

    event.stopPropagation();

    if(state === "idle" || state === "finished"){
        startGame();
    }

});

arena.addEventListener("click", function(event){

    if(event.target === startButton){
        return;
    }

    handleAction();

});

document.addEventListener("keydown", function(event){

    if(event.code === "Space"){

        event.preventDefault();

        if(state === "idle" || state === "finished"){
            startGame();
        }
        else{
            handleAction();
        }
    }

});

</script>

</body>
</html>
