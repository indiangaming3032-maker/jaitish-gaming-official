<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAITISH REACTION TEST</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%, #101c38 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #260d3d 0%, transparent 35%),
        #03040b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.game{
    width:min(92%,700px);
    text-align:center;
}

.logo{
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
    color:#00eaff;
    margin-bottom:10px;
    text-shadow:0 0 15px #00eaff;
}

h1{
    font-size:clamp(34px,8vw,65px);
    letter-spacing:3px;
    margin-bottom:8px;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #7b00ff;
}

.subtitle{
    color:#aeb6d4;
    font-size:15px;
    margin-bottom:25px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.stat{
    min-width:145px;
    padding:14px 20px;
    border:1px solid #243052;
    border-radius:14px;
    background:rgba(10,15,30,.75);
    box-shadow:0 0 20px rgba(0,234,255,.08);
}

.stat span{
    display:block;
    color:#8993b5;
    font-size:12px;
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat strong{
    font-size:25px;
    color:#00eaff;
}

#gameArea{
    width:100%;
    height:330px;
    border:2px solid #25304d;
    border-radius:25px;
    background:
        radial-gradient(circle at center,#111b35 0%,#070a15 55%,#03040b 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:.15s;
    box-shadow:
        0 0 25px rgba(0,234,255,.12),
        inset 0 0 40px rgba(123,0,255,.08);
}

#gameArea:active{
    transform:scale(.99);
}

#message{
    padding:30px;
}

#icon{
    font-size:60px;
    margin-bottom:15px;
    filter:drop-shadow(0 0 12px #00eaff);
}

#title{
    font-size:28px;
    margin-bottom:8px;
}

#instruction{
    color:#9da6c5;
    font-size:15px;
    line-height:1.5;
}

.waiting{
    background:
        radial-gradient(circle at center,#35120e 0%,#160908 50%,#03040b 100%) !important;
    border-color:#ff5a36 !important;
    box-shadow:
        0 0 35px rgba(255,80,40,.2),
        inset 0 0 50px rgba(255,60,30,.08) !important;
}

.ready{
    background:
        radial-gradient(circle at center,#063c31 0%,#061c18 50%,#03040b 100%) !important;
    border-color:#00ff9d !important;
    box-shadow:
        0 0 55px rgba(0,255,157,.35),
        inset 0 0 60px rgba(0,255,157,.12) !important;
}

.ready #icon{
    filter:drop-shadow(0 0 18px #00ff9d);
}

.ready #title{
    color:#00ff9d;
    text-shadow:0 0 15px #00ff9d;
}

button{
    margin-top:22px;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    background:linear-gradient(90deg,#00eaff,#7b00ff);
    color:white;
    font-size:15px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,234,255,.2);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 30px rgba(0,234,255,.4);
}

.hint{
    margin-top:15px;
    color:#626b89;
    font-size:12px;
}

@media(max-width:600px){
    body{
        overflow:auto;
        padding:25px 0;
    }

    .game{
        width:94%;
    }

    #gameArea{
        height:360px;
    }

    .stat{
        min-width:130px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="logo">⚡ JAITISH GAMING</div>

    <h1>REACTION TEST</h1>

    <div class="subtitle">
        How fast can you react?
    </div>

    <div class="stats">

        <div class="stat">
            <span>Your Time</span>
            <strong id="time">---</strong>
        </div>

        <div class="stat">
            <span>Best Time</span>
            <strong id="best">---</strong>
        </div>

    </div>

    <div id="gameArea">

        <div id="message">

            <div id="icon">⚡</div>

            <div id="title">
                READY?
            </div>

            <div id="instruction">
                Click or tap START<br>
                Then wait for the screen to change.
            </div>

        </div>

    </div>

    <button id="startBtn">START TEST</button>

    <div class="hint">
        PC: Click or press SPACE &nbsp; • &nbsp; Mobile: Tap the screen
    </div>

</div>

<script>

const gameArea = document.getElementById("gameArea");
const startBtn = document.getElementById("startBtn");

const timeDisplay = document.getElementById("time");
const bestDisplay = document.getElementById("best");

const icon = document.getElementById("icon");
const title = document.getElementById("title");
const instruction = document.getElementById("instruction");

let state = "idle";
let startTime = 0;
let timer = null;

let bestTime = localStorage.getItem("jaitishReactionBest");

if(bestTime){
    bestDisplay.textContent = bestTime + " ms";
}

function resetScreen(){

    clearTimeout(timer);

    state = "idle";

    gameArea.classList.remove("waiting","ready");

    icon.textContent = "⚡";
    title.textContent = "READY?";
    instruction.innerHTML =
        "Click or tap START<br>" +
        "Then wait for the screen to change.";

    startBtn.style.display = "inline-block";
    startBtn.textContent = "START TEST";
}

function startTest(){

    if(state === "waiting" || state === "ready"){
        return;
    }

    state = "waiting";

    timeDisplay.textContent = "---";

    gameArea.classList.remove("ready");
    gameArea.classList.add("waiting");

    icon.textContent = "⏳";
    title.textContent = "WAIT...";
    instruction.innerHTML =
        "Don't click yet!<br>" +
        "Wait for the green signal.";

    startBtn.style.display = "none";

    const delay = Math.floor(Math.random() * 3000) + 1500;

    timer = setTimeout(function(){

        state = "ready";

        gameArea.classList.remove("waiting");
        gameArea.classList.add("ready");

        icon.textContent = "⚡";
        title.textContent = "CLICK NOW!";
        instruction.innerHTML =
            "TAP / CLICK<br>" +
            "as fast as possible!";

        startTime = performance.now();

    },delay);
}

function reaction(){

    if(state === "idle"){
        return;
    }

    if(state === "waiting"){

        clearTimeout(timer);

        state = "idle";

        gameArea.classList.remove("waiting");

        icon.textContent = "❌";
        title.textContent = "TOO EARLY!";
        instruction.innerHTML =
            "You clicked before the signal.<br>" +
            "Try again.";

        startBtn.style.display = "inline-block";
        startBtn.textContent = "TRY AGAIN";

        return;
    }

    if(state === "ready"){

        const reactionTime =
            Math.round(performance.now() - startTime);

        state = "idle";

        timeDisplay.textContent =
            reactionTime + " ms";

        gameArea.classList.remove("ready");

        icon.textContent = "🏆";
        title.textContent = reactionTime + " ms";
        instruction.innerHTML =
            "Great reaction!<br>" +
            "Can you beat your best time?";

        if(!bestTime || reactionTime < Number(bestTime)){

            bestTime = reactionTime;

            localStorage.setItem(
                "jaitishReactionBest",
                bestTime
            );

            bestDisplay.textContent =
                bestTime + " ms";

            title.textContent =
                "NEW BEST! " + reactionTime + " ms";

        }

        startBtn.style.display = "inline-block";
        startBtn.textContent = "PLAY AGAIN";
    }
}

startBtn.addEventListener("click", function(event){

    event.stopPropagation();
    startTest();

});

gameArea.addEventListener("click", function(){

    reaction();

});

document.addEventListener("keydown", function(event){

    if(event.code === "Space"){

        event.preventDefault();

        if(state === "idle"){
            startTest();
        }else{
            reaction();
        }

    }

});

</script>

</body>
</html>
