<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jaitish AI Assistant</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:#03040b;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    radial-gradient(circle at 50% 20%,#003b55,transparent 35%),
    #03040b;
}

.ai-box{
    width:100%;
    max-width:700px;

    border:2px solid #00eaff;
    border-radius:25px;

    background:rgba(0,10,20,.9);

    box-shadow:
    0 0 20px #00eaff,
    0 0 60px #7b00ff33;

    overflow:hidden;
}

.header{
    padding:20px;

    display:flex;
    align-items:center;
    gap:15px;

    border-bottom:1px solid #00eaff55;
}

.orb{
    width:55px;
    height:55px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:25px;

    border:2px solid #00eaff;

    box-shadow:
    0 0 15px #00eaff,
    0 0 35px #00eaff;

    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{
        box-shadow:0 0 10px #00eaff;
    }
    to{
        box-shadow:
        0 0 25px #00eaff,
        0 0 50px #7b00ff;
    }
}

.header h1{
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
}

.online{
    color:#39ff14;
    font-size:12px;
    margin-top:4px;
}

.chat{
    height:420px;
    overflow-y:auto;

    padding:20px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.message{
    max-width:82%;
    padding:13px 16px;
    border-radius:16px;
    line-height:1.5;
}

.bot{
    align-self:flex-start;

    background:#061821;
    border:1px solid #00eaff55;
}

.user{
    align-self:flex-end;

    background:#11102b;
    border:1px solid #7b00ff88;
}

.input-area{
    display:flex;
    gap:10px;

    padding:15px;

    border-top:1px solid #00eaff55;
}

input{
    flex:1;
    min-width:0;

    padding:14px 18px;

    border-radius:30px;
    border:1px solid #00eaff;

    background:#02070b;
    color:white;

    outline:none;

    font-size:16px;
}

button{
    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid #00eaff;

    background:#03151c;

    color:#00eaff;

    font-size:20px;

    cursor:pointer;

    box-shadow:0 0 12px #00eaff55;
}

button:hover{
    background:#00eaff;
    color:black;
}

.quick{
    display:flex;
    gap:8px;

    padding:0 15px 15px;

    overflow-x:auto;
}

.quick button{
    width:auto;
    height:auto;

    padding:9px 14px;

    border-radius:20px;

    white-space:nowrap;

    font-size:13px;
}

@media(max-width:600px){

    .chat{
        height:380px;
    }

    .message{
        max-width:90%;
    }

}
</style>
</head>

<body>

<div class="ai-box">

    <div class="header">

        <div class="orb">
            🤖
        </div>

        <div>
            <h1>JAITISH AI</h1>
            <div class="online">● ONLINE</div>
        </div>

    </div>


    <div id="chat" class="chat">

        <div class="message bot">
            👋 Namaste Boss! Main Jaitish AI hoon.
            <br><br>
            Mujhse kuch bhi poochho.
        </div>

    </div>


    <div class="quick">

        <button onclick="quickAsk('tumhe kisne banaya')">
            👑 Kisne banaya?
        </button>

        <button onclick="quickAsk('website kisne banayi')">
            💻 Website
        </button>

        <button onclick="quickAsk('racing game kholo')">
            🏎️ Racing
        </button>

    </div>


    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Boss, kuch poochho..."
        >

        <button id="mic">
            🎤
        </button>

        <button id="send">
            ➤
        </button>

    </div>

</div>


<script>

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");


function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;
}


function aiReply(text){

    const msg =
    text.toLowerCase();


    if(
        msg.includes("hello") ||
        msg.includes("hi") ||
        msg.includes("namaste")
    ){
        return "👋 Namaste Boss! Kya hukam hai?";
    }


    if(
        msg.includes("tumhe kisne banaya") ||
        msg.includes("tumko kisne banaya") ||
        msg.includes("who made you")
    ){
        return "👑 Boss, mujhe Jaitish ne banaya hai. Main Jaitish AI hoon.";
    }


    if(
        msg.includes("website kisne") ||
        msg.includes("website banayi")
    ){
        return "💻 Ye JAITISH GAMING website Jaitish ne banayi hai, AI aur coding ki help se.";
    }


    if(
        msg.includes("tumhara naam") ||
        msg.includes("your name")
    ){
        return "🤖 Mera naam Jaitish AI Assistant hai.";
    }


    if(
        msg.includes("racing") ||
        msg.includes("race") ||
        msg.includes("game kholo")
    ){

        setTimeout(function(){

            window.location.href =
            "racing.html";

        },1200);

        return "🏎️ Yes Boss! Racing game khol raha hoon...";
    }


    if(msg.includes("python")){
        return "🐍 Python ek programming language hai.";
    }


    if(
        msg.includes("thank") ||
        msg.includes("thanks")
    ){
        return "😎 Welcome Boss!";
    }


    return "🤖 Boss, ye baat abhi meri knowledge mein nahi hai. Thoda simple way mein poochho.";
}


function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const temp =
    document.createElement("div");

    temp.innerHTML = text;

    const clean =
    temp.innerText;

    const voice =
    new SpeechSynthesisUtterance(clean);

    voice.lang = "en-IN";

    voice.rate = 0.95;

    speechSynthesis.speak(voice);
}


function sendMessage(){

    const text =
    input.value.trim();

    if(!text){
        return;
    }

    addMessage(
        "👑 " + text,
        "user"
    );

    input.value = "";


    const thinking =
    document.createElement("div");

    thinking.className =
    "message bot";

    thinking.innerText =
    "🤖 Thinking...";

    chat.appendChild(thinking);


    setTimeout(function(){

        thinking.remove();

        const reply =
        aiReply(text);

        addMessage(
            reply,
            "bot"
        );

        speak(reply);

    },500);
}


function quickAsk(text){

    input.value = text;

    sendMessage();
}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            sendMessage();
        }

    }
);


/* VOICE INPUT */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){

    const recognition =
    new SpeechRecognition();

    recognition.lang =
    "en-IN";

    recognition.continuous =
    false;

    recognition.interimResults =
    false;


    mic.addEventListener(
        "click",
        function(){

            recognition.start();

            mic.innerText = "🔴";

        }
    );


    recognition.onresult =
    function(event){

        const text =
        event.results[0][0].transcript;

        input.value = text;

        mic.innerText = "🎤";

        sendMessage();

    };


    recognition.onend =
    function(){

        mic.innerText = "🎤";

    };

}

</script>

</body>
</html>
